<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>振り分けホイール検証</title>
<style>
/* ── 本体アプリのトークンをそのまま借りる ─────────────────────────
   プロトタイプの目的は「実機で高さ配分を決める」こと。見た目が本体と違うと
   判断がずれるので、色・字面は AxisAssignFocus.vue と同じものを使う。 */
:root {
  --primary: #2563eb;
  --primary-bright: #3b82f6;
  --primary-weak: #eff6ff;
  --primary-border: #bfdbfe;
  --ink: #1e293b;
  --ink-2: #475569;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --line-soft: #eef2f6;
  --ground: #f8fafc;
  --surface: #ffffff;
  --danger: #dc2626;
  --danger-weak: #fef2f2;
  --danger-line: #fecaca;
  --amber-ink: #b45309;
  --amber-bg: #fffbeb;
  --amber-line: #fde68a;
  --ok: #16a34a;

  --font: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ── 画面の骨格。本体の振り分け画面と同じ縦の積み方 ────────────── */
.app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--ground);
  overflow: hidden;
}

.head {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.head-back { border: none; background: none; color: var(--primary); font: 700 14px var(--font); padding: 0; }
.head-title { font-size: 16px; font-weight: 800; }
.head-note { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--faint); }

/* 進捗。本体と同じ高さを占めるので、面積の計算に含める */
.prog { flex-shrink: 0; padding: 10px 14px 8px; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
.prog-text { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.prog-text b { color: var(--primary); font-size: 15px; font-variant-numeric: tabular-nums; }
.prog-pct { margin-left: auto; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog-bar { height: 8px; background: var(--line-soft); border-radius: 6px; overflow: hidden; }
.prog-fill { height: 100%; width: 0; background: var(--primary); border-radius: 6px; transition: width .35s ease; }

/* ── ホイール（縦回転）＋ 右のアクションレール ──────────────────
   横スワイプの取り合いで痛い目を見ているので、指のジェスチャは最初から
   この要素が引き取る（touch-action: none）。 */
.wheel-wrap {
  flex-shrink: 0;
  position: relative;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  transition: height .28s cubic-bezier(.22,.61,.36,1);
  overflow: hidden;
}
.wheel-wrap.reduced { transition: none; }

.stage {
  position: absolute; inset: 0 64px 0 0;
  perspective: 460px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  cursor: grab;
  overflow: hidden;            /* 回転の端が外へ出ない */
}
.stage:active { cursor: grabbing; }
/* 円筒ごと半径ぶん奥へ下げる。こうしないと中央のカードが translateZ で手前に来て、
   遠近法で拡大され左右がはみ出す（= 見切れの原因）。下げると中央が z=0 ＝原寸になる。 */
.stage-inner { position: absolute; inset: 0; transform-style: preserve-3d; }

.gcard {
  position: absolute; left: 16px; right: 16px; top: 50%;
  height: 56px; margin-top: -28px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  will-change: transform, opacity;
  backface-visibility: hidden;
}
.gcard.on {
  border-color: var(--primary);
  background: var(--primary-weak);
  box-shadow: 0 6px 18px rgba(37,99,235,.18);
}
.gname { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; color: var(--ink);
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcount {
  flex-shrink: 0; min-width: 44px; text-align: center;
  background: var(--line-soft); color: var(--muted);
  border-radius: 14px; padding: 2px 10px;
  font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.gcard.on .gcount { background: var(--primary); color: #fff; }
.gcount.bump { animation: bump .34s cubic-bezier(.34,1.56,.64,1); }
@keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)} }

/* 中央を指す線。どれが振り分け先かを、位置だけでなく形でも示す */
.marker { position: absolute; left: 0; right: 64px; top: 50%; height: 58px; margin-top: -29px;
          pointer-events: none; border-top: 1px solid var(--primary-border);
          border-bottom: 1px solid var(--primary-border); opacity: .5; }
.wheel-wrap.band .marker { display: none; }
/* 帯＝中央のカードそのもの。別の見た目に差し替えず、同じカードが縮むので
   開閉が1つづきの動きに見える。レールは畳んで幅を返す。 */
.wheel-wrap.band .rail { opacity: 0; pointer-events: none; }
.wheel-wrap.band .stage { right: 0; }
.stage { transition: right .28s cubic-bezier(.22,.61,.36,1); }
.rail { transition: opacity .2s; }
/* 帯のときだけ出る「変える」。絶対配置で重ねると件数と被るので、
   カードの中の要素にして flex の gap に間隔を任せる。 */
.gchev {
  display: none; flex-shrink: 0;
  font-size: 11px; font-weight: 800; color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
  background: var(--surface); white-space: nowrap;
}
.wheel-wrap.band .gcard.on .gchev { display: block; }

/* 上下のフェード。回転が「続いている」ことを示す */
.fade { position: absolute; left: 0; right: 64px; height: 34px; pointer-events: none; z-index: 2; }
.fade.t { top: 0; background: linear-gradient(var(--surface), rgba(255,255,255,0)); }
.fade.b { bottom: 0; background: linear-gradient(rgba(255,255,255,0), var(--surface)); }
.wheel-wrap.band .fade { display: none; }

/* 右のレール。操作は「今まん中にある1枚」に効く */
.rail {
  position: absolute; top: 0; right: 0; bottom: 0; width: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border-left: 1px solid var(--line-soft);
  background: linear-gradient(90deg, rgba(248,250,252,0), var(--ground));
}
.rail-btn {
  width: 46px; height: 44px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  font-size: 16px; color: var(--muted);
  -webkit-tap-highlight-color: transparent;
}
.rail-btn:active { background: var(--line-soft); }
.rail-btn.gear { font-size: 18px; }
/* 消すだけ色を分ける。足すと消すが隣り合わないよう、間に ⚙ を置いている */
.rail-btn.del { border-color: var(--danger-line); color: var(--danger); }
.rail-btn.del:active { background: var(--danger-weak); }


/* ── 品目プール ────────────────────────────────────────────── */
.tools { flex-shrink: 0; display: flex; gap: 8px; padding: 8px 14px; background: var(--ground); }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
          font: 15px var(--font); background: var(--surface); color: var(--ink); }
.chip { flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
        border-radius: 10px; font: 800 12px var(--font); padding: 0 12px; }
.chip.on { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-line); }

.list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 14px 24px;
        -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
  padding: 9px 14px; margin-bottom: 8px; text-align: left;
  font: 15px var(--font); color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}
.item.in { background: var(--primary-weak); border-color: var(--primary-border); }
.check {
  width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #cbd5e1; border: 1.5px solid var(--line);
}
.item.in .check { background: var(--primary); color: #fff; border-color: var(--primary); }
.iname { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 42%; }
.tag { font-size: 10px; font-weight: 700; color: var(--muted); background: var(--line-soft);
       border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag.cur { color: #fff; background: var(--primary); }

/* 飛んでいく品目。入力を待たせないよう、何個でも同時に走らせる */
.fly {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--primary); color: #fff;
  font: 800 12px var(--font); padding: 5px 10px; border-radius: 999px;
  box-shadow: 0 6px 16px rgba(37,99,235,.35);
  white-space: nowrap;
}

/* ── 計測パネル。この試作の本体 ────────────────────────────────
   決めたいのは「ホイールに何px使えるか」だけなので、その場で切り替えて
   見える行数と滑らかさを読めるようにする。 */
/* 一括編集（z-index 85）より上に置く。下だと編集画面を開いたとたんに計測パネルへ
   触れなくなり、並べ替えを見ながら速さを変えられない。 */
.probe {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 95;
  background: rgba(15,23,42,.94); color: #fff; border-radius: 14px;
  padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  font-size: 12px;
}
.probe.min { padding: 8px 12px; }
.probe-head { display: flex; align-items: center; gap: 10px; }
.probe-title { font-weight: 800; letter-spacing: .04em; }
.probe-toggle { margin-left: auto; border: 1px solid rgba(255,255,255,.28); background: none; color: #fff;
                border-radius: 8px; font: 800 11px var(--font); padding: 5px 10px; }
.probe-body { margin-top: 10px; display: grid; gap: 8px; }
.probe.min .probe-body { display: none; }
.probe-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.probe-label { width: 78px; flex-shrink: 0; color: #cbd5e1; font-weight: 700; }
.seg { border: 1px solid rgba(255,255,255,.28); background: none; color: #fff;
       border-radius: 8px; font: 800 11px var(--font); padding: 6px 9px; }
.seg.on { background: var(--primary-bright); border-color: var(--primary-bright); }
.stat { display: flex; gap: 14px; padding-top: 2px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
.stat b { color: #fff; font-size: 14px; }
.stat .warn { color: #fca5a5; }

/* ── 分類先の一括編集。19個の順番を入れ替えるのは、回すより一覧の方が確実 ──
   つまみ（⋮⋮）を掴んでいる間だけ行が動く。行そのものを掴ませると、
   スクロールと取り合いになって並べ替えのつもりが画面ごと流れる。 */
.edit-page {
  position: fixed; inset: 0; z-index: 85;
  background: var(--ground);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.22,.61,.36,1);
}
.edit-page.on { transform: translateY(0); }
.edit-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.edit-title { font-size: 16px; font-weight: 800; }
.edit-sub { font-size: 11px; color: var(--faint); font-weight: 700; }
.edit-done { margin-left: auto; border: none; background: var(--primary); color: #fff;
             border-radius: 10px; font: 800 14px var(--font); padding: 9px 18px; }
.edit-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px 72px; }
.erow {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 8px 10px 8px 4px; margin-bottom: 8px;
  transition: box-shadow .16s, opacity .16s;
}
.erow.drag { box-shadow: 0 12px 28px rgba(15,23,42,.22); border-color: var(--primary);
             position: relative; z-index: 5; }
.edit-list.dragging .erow:not(.drag) { opacity: .55; }
/* 避けている最中の行。どれが動いたか目で追えるようにする */
.erow.shifting { border-color: var(--primary-border); background: var(--primary-weak); }
.ehandle {
  flex-shrink: 0; width: 40px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: var(--faint); font-size: 17px; letter-spacing: -2px;
  touch-action: none; cursor: grab; -webkit-tap-highlight-color: transparent;
}
.erow.drag .ehandle { cursor: grabbing; color: var(--primary); }
.ename { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: var(--ink);
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ecount { flex-shrink: 0; min-width: 42px; text-align: center; font-size: 13px; font-weight: 800;
          color: var(--muted); background: var(--line-soft); border-radius: 12px; padding: 3px 8px;
          font-variant-numeric: tabular-nums; }
.ebtn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 9px;
        border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px;
        -webkit-tap-highlight-color: transparent; }
.ebtn.del { border-color: var(--danger-line); color: var(--danger); }
.edit-foot { flex-shrink: 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
             background: var(--surface); border-top: 1px solid var(--line); }
.edit-add { width: 100%; border: 1.5px dashed var(--primary-border); background: var(--surface);
            color: var(--primary); border-radius: 12px; font: 800 14px var(--font); padding: 13px; }

/* 名前の入力・削除の確認。prompt/confirm は埋め込み環境で塞がれることがあるので画面内に持つ */
.sheet-bg { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.45);
            display: none; align-items: center; justify-content: center; padding: 22px; }
.sheet-bg.on { display: flex; }
.sheet { width: 100%; max-width: 340px; background: var(--surface); border-radius: 16px;
         padding: 18px 16px 16px; box-shadow: 0 14px 40px rgba(0,0,0,.28); }
.sheet-title { font-size: 15px; font-weight: 800; color: var(--ink); text-align: center; }
.sheet-sub { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
.sheet-input { width: 100%; margin-top: 14px; border: 1.5px solid var(--primary-border);
               border-radius: 12px; padding: 13px 14px; font: 15px var(--font); color: var(--ink); }
.sheet-acts { display: flex; gap: 10px; margin-top: 14px; }
.sheet-acts button { flex: 1; border-radius: 10px; font: 800 14px var(--font); padding: 12px; }
.sheet-cancel { border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.sheet-ok { border: none; background: var(--primary); color: #fff; }
.sheet-ok.danger { background: var(--danger); }

/* OS の「視差効果を減らす」を尊重する。ただし試作では、その設定が入っていて
   動きが見えないのか、こちらの実装が動いていないのかを切り分けたいので、
   計測パネルから強制ONにできるようにしてある（.force-motion）。 */
@media (prefers-reduced-motion: reduce) {
  :root:not(.force-motion) .wheel-wrap,
  :root:not(.force-motion) .prog-fill { transition: none; }
  :root:not(.force-motion) .gcount.bump { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <button class="head-back" type="button">‹ 閉じる</button>
    <span class="head-title">保管場所</span>
    <span class="head-note">試作</span>
  </header>

  <div class="prog">
    <div class="prog-text">
      <span id="progIcon">📦</span>
      <span>振り分け済み <b id="progDone">0</b> / <span id="progTotal">0</span></span>
      <span class="prog-pct" id="progPct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div class="wheel-wrap" id="wheelWrap">
    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner"></div>
      <div class="marker"></div>
      <div class="fade t"></div>
      <div class="fade b"></div>
    </div>
    <div class="rail">
      <button class="rail-btn" type="button" id="btnNew" aria-label="分類先を足す">＋</button>
      <button class="rail-btn gear" type="button" id="btnManage" aria-label="分類先をまとめて編集">⚙</button>
      <button class="rail-btn del" type="button" id="btnDel" aria-label="この分類先を消す">🗑</button>
    </div>
  </div>

  <div class="tools">
    <input class="search" id="search" type="text" placeholder="品目を検索" autocomplete="off">
    <button class="chip" type="button" id="chipUn">未振り分けのみ</button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="edit-page" id="editPage">
  <header class="edit-head">
    <div>
      <div class="edit-title">分類先の管理</div>
      <div class="edit-sub" id="editSub"></div>
    </div>
    <button class="edit-done" type="button" id="editDone">完了</button>
  </header>
  <div class="edit-list" id="editList"></div>
  <div class="edit-foot">
    <button class="edit-add" type="button" id="editAdd">＋ 分類先を追加</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-title" id="sheetTitle">分類先の名前</div>
    <div class="sheet-sub" id="sheetSub"></div>
    <input class="sheet-input" id="sheetInput" maxlength="20" autocomplete="off">
    <div class="sheet-acts">
      <button class="sheet-cancel" type="button" id="sheetCancel">キャンセル</button>
      <button class="sheet-ok" type="button" id="sheetOk">決定</button>
    </div>
  </div>
</div>

<div class="probe min" id="probe">
  <div class="probe-head">
    <span class="probe-title">計測</span>
    <span class="stat">
      <span>見える行 <b id="statRows">–</b></span>
      <span>fps <b id="statFps">–</b></span>
    </span>
    <button class="probe-toggle" type="button" id="probeToggle">開く</button>
  </div>
  <div class="probe-body">
    <div class="probe-row">
      <span class="probe-label">確認</span>
      <button class="seg" id="segDemo">避けるを再生（3つ動かす）</button>
    </div>
    <div class="probe-row">
      <span class="probe-label">動き</span>
      <span id="motionState" style="font-weight:800"></span>
      <button class="seg" id="segMotion">強制ON</button>
    </div>
    <div class="probe-row">
      <span class="probe-label">面積</span>
      <button class="seg on" id="segAuto">触った方を広げる</button>
    </div>
    <div class="stat">
      <span>直前の避ける <b id="statFlip">–</b></span>
      <span>分類先 <b id="statGroups">0</b></span>
      <span>品目 <b id="statItems">0</b></span>
      <span id="statHint"></span>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ── 実運用に近いデータ。19の分類先と、飲食店の実在する品目名 ───────────────
const GROUPS = [
  '冷蔵庫1', '冷蔵庫2', '冷凍庫', '野菜室', 'ドリンク冷蔵',
  '冷蔵ショーケース', '乾物棚', '棚A', '棚B', '棚C',
  '調味料棚', '米・粉', '酒類棚', '製菓材料', 'カウンター下',
  '予備棚', '事務所', '外倉庫', 'パントリー',
];

const ITEMS = [
  '牛バラ','牛肩ロース','豚バラ','豚ロース','豚こま','鶏もも','鶏むね','鶏ささみ','鶏手羽先','合挽きミンチ',
  'ベーコン','ロースハム','ソーセージ','生ハム','鴨ロース','ラムチョップ','牛タン','砂肝','レバー','豚足',
  'まぐろ赤身','サーモン','ぶり','鯛','ホタテ','海老（バナメイ）','するめいか','たこ足','あさり','しじみ',
  'いくら','明太子','ちりめんじゃこ','鰹節','煮干し','焼き海苔','わかめ','ひじき','切干大根','高野豆腐',

  'ウーロン茶','緑茶ティーバッグ','コーヒー豆','紅茶','オレンジジュース','コーラ','ジンジャーエール','炭酸水','ミネラルウォーター','氷',
];

const $ = id => document.getElementById(id);

// ── 状態 ──────────────────────────────────────────────────────────────
const counts = new Array(GROUPS.length).fill(0);
const assigned = new Map();          // 品目 → Set(分類先index)
let pos = 0;                         // ホイールの位置（小数＝回転中）
let target = 0;                      // 中央にある分類先
let unassignedOnly = false;
let query = '';
// 実機で 248(5枚) / 196(3枚) / 152(2枚) / 帯56 を見比べて決めた高さ。
// 静止時は 196。回している間は spinHeight() で画面の 54% まで広がる。
const wheelH = 196;
let focusFollow = true;   // 触った方に面積を寄せる
let banded = false;

// OS の「視差効果を減らす」。入っていると動きは全部止まる＝調整しても何も変わらない。
// 見えないのが設定のせいか実装のせいか分からなくなるので、状態を画面に出し、
// 計測パネルから強制ONにできるようにする。
const prefersReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let forceMotion = false;
const noAnim = () => prefersReduce && !forceMotion;
function applyMotionMode() {
  document.documentElement.classList.toggle('force-motion', forceMotion);
  $('wheelWrap').classList.toggle('reduced', noAnim());
}
applyMotionMode();

// ── ホイールの描画 ─────────────────────────────────────────────────────
// 19枚を円周に並べるが、描くのは中央から前後4枚だけ。残りを回し続けると
// 端末が古いほど落ちるので、見えない分は最初から作らない。
const STEP = 19;          // 1枚あたりの角度
const VISIBLE = 4;        // 中央から前後いくつ描くか
const CARD_H = 56;
const radius = Math.round((CARD_H / 2) / Math.tan((STEP / 2) * Math.PI / 180));

const inner = $('stageInner');
inner.style.transform = `translateZ(${-radius}px)`;
const cardEls = [];
for (let i = 0; i < VISIBLE * 2 + 1; i++) {
  const el = document.createElement('div');
  el.className = 'gcard';
  el.innerHTML = '<span class="gname"></span><span class="gcount"></span>' +
                 '<span class="gchev">変える ▾</span>';
  inner.appendChild(el);
  cardEls.push(el);
}

function wrapIndex(i) { const n = GROUPS.length; return ((i % n) + n) % n; }

// fan = 開き具合。1 で扇状に開き、0 で中央へ重なって畳まれる。
// 高さの変化と同じ時間で動かすので、開閉が「伸び縮み」ではなく
// 「カードが開く/閉じる」動きに見える。
let fan = 1;

function renderWheel() {
  const base = Math.round(pos);
  for (let k = -VISIBLE; k <= VISIBLE; k++) {
    const el = cardEls[k + VISIBLE];
    const idx = wrapIndex(base + k);
    const offset = (base + k) - pos;           // 中央からの距離（小数）
    const angle = offset * STEP * fan;
    const center = Math.abs(offset) < .5;
    if (Math.abs(angle) > 62) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue; }
    const dim = Math.max(0, 1 - Math.abs(offset) / (VISIBLE + .4));
    el.style.opacity = String(center ? 1 : dim * fan);
    el.style.pointerEvents = fan > .6 ? 'auto' : 'none';
    el.style.transform = `rotateX(${-angle}deg) translateZ(${radius}px)`;
    el.style.zIndex = String(100 - Math.round(Math.abs(offset) * 10));
    el.querySelector('.gname').textContent = GROUPS[idx];
    el.querySelector('.gcount').textContent = counts[idx];
    el.classList.toggle('on', center);
    el.dataset.idx = String(idx);
  }
  const next = wrapIndex(Math.round(pos));
  if (next !== target) {
    target = next;
    renderList();
  }
}

// 開閉のトゥイーン。高さの transition（.28s）と同じ長さ・同じ曲線でそろえる
let fanRaf = 0;
function tweenFan(to) {
  cancelAnimationFrame(fanRaf);
  if (noAnim()) { fan = to; renderWheel(); return; }
  const from = fan, t0 = performance.now(), D = 280;
  const step = () => {
    const t = Math.min(1, (performance.now() - t0) / D);
    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease-in-out
    fan = from + (to - from) * e;
    renderWheel();
    if (t < 1) fanRaf = requestAnimationFrame(step);
  };
  fanRaf = requestAnimationFrame(step);
}

// ── 指で回す。慣性で遠くまで飛ばせないと19個は探せない ──────────────────
const stage = $('stage');
let dragging = false, lastY = 0, lastT = 0, vel = 0, raf = 0;
const PX_PER_CARD = 46;

// 並べ替えはホイールでは持たない。回しながら19枚の中の狙った位置に置くのは難しく、
// 「回す」と「動かす」が同じ指の動きになって取り違える。順番の入れ替えは ⚙ の
// 一括編集画面（一覧＋つまみ）にまとめる。ここは「回して選ぶ」だけ。
stage.addEventListener('pointerdown', e => {
  dragging = true; lastY = e.clientY; lastT = performance.now(); vel = 0;
  cancelAnimationFrame(raf);
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dy = e.clientY - lastY;
  const dt = Math.max(1, now - lastT);
  pos -= dy / PX_PER_CARD;
  vel = (-dy / PX_PER_CARD) / dt * 16;        // 1フレームあたりの移動量
  lastY = e.clientY; lastT = now;
  renderWheel();
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  glide();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

function glide() {
  cancelAnimationFrame(raf);
  const step = () => {
    vel *= 0.94;                               // 摩擦
    pos += vel;
    if (Math.abs(vel) < 0.008) {               // 止まりかけたら一番近い枠へ吸い付く
      const snap = Math.round(pos);
      pos += (snap - pos) * 0.28;
      if (Math.abs(snap - pos) < 0.002) { pos = snap; renderWheel(); settleWheel(); return; }
    }
    renderWheel();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

// 中央以外のカードをタップしたら、そこまで回す（19個を1枚ずつ送らせない）
stage.addEventListener('click', e => {
  const card = e.target.closest('.gcard');
  if (!card) return;
  const idx = Number(card.dataset.idx);
  if (idx === target) return;
  const n = GROUPS.length;
  let d = ((idx - wrapIndex(Math.round(pos))) % n + n) % n;
  if (d > n / 2) d -= n;
  vel = d * 0.16; glide();
});

// ── 品目一覧 ───────────────────────────────────────────────────────────
const listEl = $('list');

function groupsOf(item) { return assigned.get(item) || new Set(); }

function visibleItems() {
  const q = query.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!q || i.toLowerCase().includes(q)) &&
    (!unassignedOnly || groupsOf(i).size === 0)
  );
}

function renderList() {
  const frag = document.createDocumentFragment();
  for (const item of visibleItems()) {
    const gs = groupsOf(item);
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'item' + (gs.has(target) ? ' in' : '');
    el.dataset.item = item;
    const tags = [...gs].slice(0, 3)
      .map(g => `<span class="tag${g === target ? ' cur' : ''}">${GROUPS[g]}</span>`).join('');
    el.innerHTML =
      `<span class="check">${gs.has(target) ? '✓' : '＋'}</span>` +
      `<span class="iname">${item}</span>` +
      (tags ? `<span class="tags">${tags}</span>` : '');
    frag.appendChild(el);
  }
  listEl.replaceChildren(frag);
  measureRows();
}

listEl.addEventListener('click', e => {
  const el = e.target.closest('.item');
  if (!el) return;
  toggle(el.dataset.item, el);
});

function toggle(item, el) {
  const gs = assigned.get(item) || new Set();
  if (gs.has(target)) {
    gs.delete(target); counts[target]--;
  } else {
    gs.add(target); counts[target]++;
    fly(el);                                   // すぽっと入る
    bumpCount();
  }
  assigned.set(item, gs);
  updateRow(el, item);
  renderWheel();
  updateProgress();
}

function updateRow(el, item) {
  const gs = groupsOf(item);
  el.classList.toggle('in', gs.has(target));
  el.querySelector('.check').textContent = gs.has(target) ? '✓' : '＋';
  const tags = [...gs].slice(0, 3)
    .map(g => `<span class="tag${g === target ? ' cur' : ''}">${GROUPS[g]}</span>`).join('');
  const holder = el.querySelector('.tags');
  if (tags && holder) holder.innerHTML = tags;
  else if (tags) el.insertAdjacentHTML('beforeend', `<span class="tags">${tags}</span>`);
  else if (holder) holder.remove();
}

// 品目が分類先へ飛ぶ。何個同時でも走らせる＝連打を待たせない
function fly(fromEl) {
  if (noAnim()) return;
  const a = fromEl.getBoundingClientRect();
  const wrap = $('wheelWrap').getBoundingClientRect();
  const toX = wrap.left + (wrap.width - (banded ? 0 : 64)) / 2;
  const toY = wrap.top + wrap.height / 2;
  const chip = document.createElement('div');
  chip.className = 'fly';
  chip.textContent = fromEl.querySelector('.iname').textContent;
  document.body.appendChild(chip);
  const anim = chip.animate([
    { transform: `translate(${a.left + 34}px, ${a.top + 6}px) scale(1)`, opacity: 1 },
    { transform: `translate(${(a.left + toX) / 2}px, ${(a.top + toY) / 2 - 46}px) scale(.9)`, opacity: 1, offset: .55 },
    { transform: `translate(${toX - 30}px, ${toY - 12}px) scale(.35)`, opacity: 0 },
  ], { duration: 380, easing: 'cubic-bezier(.4,.0,.2,1)' });
  anim.onfinish = () => chip.remove();
}

let bumpT = 0;
function bumpCount() {
  const el = cardEls[VISIBLE].querySelector('.gcount');
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  clearTimeout(bumpT);
  bumpT = setTimeout(() => el.classList.remove('bump'), 400);
}

function updateProgress() {
  let done = 0;
  for (const i of ITEMS) if (groupsOf(i).size) done++;
  const pct = Math.round(done / ITEMS.length * 100);
  $('progDone').textContent = done;
  $('progPct').textContent = pct + '%';
  $('progFill').style.width = pct + '%';
  $('progIcon').textContent = done === ITEMS.length ? '🎉' : '📦';
}

// ── 触った方が広がる ──────────────────────────────────────────────────
// ホイールに触れば分類先を選ぶ時間、一覧に触れば品目を入れる時間。
// どちらを見ているかは指が知っているので、指の行き先に面積を寄せる。
//
// 詰まらせない工夫が2つ。
//   ・畳むのは指を離してから（引いている最中に足元が動くと狙いが外れる）
//   ・ホイールを回している最中は、一覧側のスクロール由来の畳みを受け付けない
// 面積は3段階。回している間がいちばん広い。
//   band … 入れている時間。分類先は1行だけ残す
//   open … 選び終わって止まっている時間
//   spin … 回している時間。探しているのだから、いちばん見せる
const BAND_H = 56;
let state = 'open';
let settleTimer = 0;

function spinHeight() {
  return Math.min(Math.round(innerHeight * 0.54), wheelH + 140);
}
function heightFor(st) {
  return st === 'band' ? BAND_H : st === 'spin' ? spinHeight() : wheelH;
}
function setState(next) {
  if (state === next) return;
  const wasBand = banded;
  state = next;
  banded = next === 'band';
  const wrap = $('wheelWrap');
  wrap.classList.toggle('band', banded);
  wrap.style.height = heightFor(next) + 'px';
  if (banded !== wasBand) tweenFan(banded ? 0 : 1);   // 畳む＝重なる / 開く＝扇状に開く
  setTimeout(measureRows, 320);
}
function setBand(on) { setState(on ? 'band' : 'open'); }   // 計測パネルから使う

// ホイールに触れた → いきなり広げる。指が乗った瞬間に開き切って、そのまま回せる
function grabWheel() { if (focusFollow) { clearTimeout(settleTimer); setState('spin'); } }
stage.addEventListener('pointerdown', grabWheel, true);

// 回り終わって少し置いたら、選び終わった大きさへ戻す
function settleWheel() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { if (state === 'spin') setState('open'); }, 900);
}

// 一覧に触れた → 畳む。回している最中は無視する
function listTouched() {
  if (!focusFollow) return;
  if (dragging || Math.abs(vel) > 0.01) return;   // ホイールがまだ動いている
  clearTimeout(settleTimer);
  setState('band');
}
listEl.addEventListener('pointerdown', listTouched);
listEl.addEventListener('scroll', listTouched, { passive: true });
$('search').addEventListener('focus', listTouched);

// ── 画面内ダイアログ ───────────────────────────────────────────────────
let sheetDone = null;
function openSheet({ title, sub = '', value = null, ok = '決定', danger = false }, done) {
  sheetDone = done;
  $('sheetTitle').textContent = title;
  $('sheetSub').textContent = sub;
  const input = $('sheetInput');
  input.style.display = value === null ? 'none' : '';
  input.value = value ?? '';
  const okBtn = $('sheetOk');
  okBtn.textContent = ok;
  okBtn.classList.toggle('danger', danger);
  $('sheetBg').classList.add('on');
  if (value !== null) setTimeout(() => input.focus(), 30);
}
function closeSheet() { $('sheetBg').classList.remove('on'); sheetDone = null; }
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });
$('sheetOk').addEventListener('click', () => {
  const fn = sheetDone;
  const v = $('sheetInput').value.trim();
  closeSheet();
  fn?.(v);
});
$('sheetInput').addEventListener('keyup', e => { if (e.key === 'Enter') $('sheetOk').click(); });

// ── 分類先の一括編集 ───────────────────────────────────────────────────
// 追加・名前変更・削除・並べ替えをここ1枚にまとめる。ホイールは「回して選ぶ」だけに残す。
const editPage = $('editPage'), editList = $('editList');
let editOpenName = null;      // 開いた時に中央だった分類先。閉じるときそこへ戻す

$('btnManage').addEventListener('click', openEdit);

// ⚙ の一括編集は「まとめて直す」ための場所。ここでは1枚だけを足す・消す。
// 振り分けの途中で「この棚が要る」「この棚はもう無い」と気づいたとき、
// 一覧まで行かずに済ませられるようにする。
$('btnNew').addEventListener('click', () => {
  openSheet({
    title: '分類先を足す',
    sub: `「${GROUPS[target]}」のすぐ下に入ります`,
    value: '', ok: '追加',
  }, name => {
    if (!name) return;
    const at = target + 1;
    GROUPS.splice(at, 0, name);
    counts.splice(at, 0, 0);
    pos = at; target = -1;               // 足した1枚を中央へ持ってくる
    renderWheel(); renderList(); updateStats();
    setState('spin'); settleWheel();     // 増えたことが見えるようにホイールを開く
  });
});

$('btnDel').addEventListener('click', () => {
  if (GROUPS.length <= 1) return;
  const gone = target;
  openSheet({
    title: `「${GROUPS[gone]}」を消しますか？`,
    sub: counts[gone] ? `${counts[gone]}件の割り当ても外れます` : '割り当てはありません',
    ok: '削除する', danger: true,
  }, () => doDelete(gone));
});
$('editDone').addEventListener('click', closeEdit);

function openEdit() {
  editOpenName = GROUPS[target];
  renderEdit();
  editPage.classList.add('on');
}
function closeEdit() {
  editPage.classList.remove('on');
  // 編集で順番が変わっていても、見ていた分類先の前に戻す
  const i = GROUPS.indexOf(editOpenName);
  pos = i >= 0 ? i : Math.min(target, GROUPS.length - 1);
  target = -1;
  renderWheel(); renderList(); updateProgress(); updateStats();
}

function renderEdit() {
  $('editSub').textContent = `${GROUPS.length}件 ・ つまみ ⋮⋮ を掴んで並べ替え`;
  const frag = document.createDocumentFragment();
  GROUPS.forEach((g, i) => {
    const row = document.createElement('div');
    row.className = 'erow';
    row.dataset.i = String(i);
    row.innerHTML =
      `<span class="ehandle" aria-label="並べ替え">⋮⋮</span>` +
      `<span class="ename"></span>` +
      `<span class="ecount">${counts[i]}</span>` +
      `<button class="ebtn rename" type="button" aria-label="名前を変える">✎</button>` +
      `<button class="ebtn del" type="button" aria-label="削除">🗑</button>`;
    row.querySelector('.ename').textContent = g;
    frag.appendChild(row);   // 毎回作り直すので inline の transform / transition は残らない
  });
  editList.replaceChildren(frag);
}

editList.addEventListener('click', e => {
  const row = e.target.closest('.erow');
  if (!row) return;
  const i = [...editList.children].indexOf(row);
  if (e.target.closest('.rename')) {
    openSheet({ title: '分類先の名前を変える', value: GROUPS[i] }, name => {
      if (!name) return;
      GROUPS[i] = name; renderEdit();
    });
  } else if (e.target.closest('.del')) {
    if (GROUPS.length <= 1) return;
    openSheet({
      title: `「${GROUPS[i]}」を消しますか？`,
      sub: counts[i] ? `${counts[i]}件の割り当ても外れます` : '割り当てはありません',
      ok: '削除する', danger: true,
    }, () => { doDelete(i); renderEdit(); });
  }
});

$('editAdd').addEventListener('click', () => {
  openSheet({ title: '分類先を足す', sub: '一覧のいちばん下に入ります', value: '', ok: '追加' }, name => {
    if (!name) return;
    GROUPS.push(name); counts.push(0);
    renderEdit();
    editList.scrollTop = editList.scrollHeight;
  });
});

// つまみを掴んで並べ替え。行そのものを掴ませると縦スクロールと取り合いになるので、
// つまみだけ touch-action: none にして、ここでジェスチャを引き取る。
let dragRow = null, dragY0 = 0, dragDy = 0;

// 入れ替えを FLIP で見せる。並べ替えは「どれがどこへ動いたか」が分からないと
// 結果を確かめられないので、瞬間移動させず、退く行が滑って場所を空ける。
// 掴んでいる行は指の下に居るべきなので、こちらは動かさない。
// 2つの動きは役割が違うので、速さも曲線も分ける。
//   避ける（FLIP）… 周りの行が場所を空ける動き。長く尾を引いて止まる曲線でヌルっと見せる
//   着地（DROP）  … 掴んだ行が枠へ収まる動き。指の下なので、もたつくと遅れて感じる
// 実機で 620 / 900 / 1200 / 1600 × ふつう / ねばり / とろり を試して決めた値。
// 620ms + ふつう（標準の ease-in-out）。粘らせすぎると、並べ替えのたびに
// 待たされる画面になる。
const FLIP_MS = 620;
const FLIP_EASE = 'cubic-bezier(.4, 0, .2, 1)';
// 「視差効果を減らす」のときの値。0 にはしない。
// この動きは飾りではなく「どの行がどこへ動いたか」を伝える情報で、
// 消すと並べ替えた結果を確かめられなくなる。短く・直線的にして残す。
const FLIP_MS_REDUCED = 180;
const FLIP_EASE_REDUCED = 'linear';
const DROP_MS = 280;
const DROP_EASE = 'cubic-bezier(.22, .8, .28, 1)';
function flipRows(mutate) {
  const rows = [...editList.children];
  const before = new Map(rows.map(r => [r, r.getBoundingClientRect().top]));
  mutate();
  const ms   = noAnim() ? FLIP_MS_REDUCED : FLIP_MS;
  const ease = noAnim() ? FLIP_EASE_REDUCED : FLIP_EASE;
  let moved = 0;
  for (const r of rows) {
    if (r === dragRow) continue;
    const d = before.get(r) - r.getBoundingClientRect().top;
    if (!d) continue;
    // 開始値（元居た場所）を一度スタイルに確定させてから、終了値へ動かす。
    // requestAnimationFrame をはさむだけでは確定しないことがあり、その場合
    // ブラウザは「動かす前」を知らないので補間できず、瞬間移動になる（＝見えない）。
    // offsetHeight を読むと、その場で必ず確定する。
    r.style.transition = 'none';
    r.style.transform = `translateY(${d}px)`;
    void r.offsetHeight;
    r.classList.add('shifting');
    r.style.transition = `transform ${ms}ms ${ease}`;
    r.style.transform = '';
    r.addEventListener('transitionend', () => r.classList.remove('shifting'), { once: true });
    moved++;
  }
  reportFlip(moved, `${ms}ms${noAnim() ? '（控えめ）' : ''}`);
}

// 「動いたはず」を数字で出す。ここが 0行 なら実装、行数が出ているのに
// 見た目が変わらないならブラウザ側、と切り分けられる。
function reportFlip(n, how) {
  const el = $('statFlip');
  if (el) el.textContent = `${n}行 / ${how}`;
}

editList.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.ehandle');
  if (!handle) return;
  dragRow = handle.closest('.erow');
  dragY0 = e.clientY; dragDy = 0;
  dragRow.classList.add('drag');
  editList.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
  navigator.vibrate?.(10);
});
editList.addEventListener('pointermove', e => {
  if (!dragRow) return;
  e.preventDefault();
  dragDy = e.clientY - dragY0;
  dragRow.style.transition = 'none';
  dragRow.style.transform = `translateY(${dragDy}px)`;
  edgeScrollFrom(e.clientY);
  // 指の位置にある行と入れ替える。DOM も配列も同時に動かすので、離した時点で確定済み。
  //
  // 掴んだ行は指に追従しているので、いちばん上に居るのは常に自分自身。
  // elementFromPoint（単数）だとそれしか返らず、入れ替え先が永久に見つからない
  // ＝並べ替えが一度も起きなかった。重なり全部を取り、自分以外の最初の行を選ぶ。
  const over = document.elementsFromPoint(e.clientX, e.clientY)
    .map(el => el.closest?.('.erow'))
    .find(r => r && r !== dragRow);
  if (!over) return;
  const rows = [...editList.children];
  const from = rows.indexOf(dragRow), to = rows.indexOf(over);
  if (from < 0 || to < 0) return;
  // 相手に触れた時点ではまだ入れ替えない。中点を越えてから動かす。
  // 触れただけで避けると「避けすぎ」に見えるうえ、境界で行ったり来たりしてぶれる。
  const box = over.getBoundingClientRect();
  const mid = box.top + box.height / 2;
  if (to > from ? e.clientY < mid : e.clientY > mid) return;
  flipRows(() => {
    editList.insertBefore(dragRow, from < to ? over.nextSibling : over);
    GROUPS.splice(to, 0, GROUPS.splice(from, 1)[0]);
    counts.splice(to, 0, counts.splice(from, 1)[0]);
  });
  // 入れ替えた行は指の位置へ移っている。基準を今の指に取り直して、
  // ずれを持ち越さない（持ち越すと行が指から離れていく）
  dragY0 = e.clientY;
  dragRow.style.transform = '';
  navigator.vibrate?.(6);
});
function endRowDrag() {
  if (!dragRow) return;
  // 掴んだ行を、今いる枠へ滑らせて着地させる
  dragRow.style.transition = noAnim()
    ? `transform ${FLIP_MS_REDUCED}ms ${FLIP_EASE_REDUCED}`
    : `transform ${DROP_MS}ms ${DROP_EASE}`;
  dragRow.style.transform = '';
  dragRow.classList.remove('drag');
  editList.classList.remove('dragging');
  dragRow = null;
  stopEdgeScroll();
  // DOM の並びは配列とすでに一致しているので作り直さない
  // （作り直すと、走っている FLIP が捨てられて瞬間移動に見える）
}
editList.addEventListener('pointerup', endRowDrag);
editList.addEventListener('pointercancel', endRowDrag);

// 19件あると、下の行を上まで運ぶのに一覧のスクロールが要る。
// 掴んだまま端に寄せたら、その向きへ流す。
const EDGE = 64, EDGE_SPEED = 10;
let edgeRaf = 0, edgeDir = 0;
function edgeScrollFrom(y) {
  const r = editList.getBoundingClientRect();
  edgeDir = y < r.top + EDGE ? -1 : y > r.bottom - EDGE ? 1 : 0;
  if (!edgeDir) return stopEdgeScroll();
  if (edgeRaf) return;
  const step = () => {
    if (!dragRow || !edgeDir) return stopEdgeScroll();
    editList.scrollTop += edgeDir * EDGE_SPEED;
    edgeRaf = requestAnimationFrame(step);
  };
  edgeRaf = requestAnimationFrame(step);
}
function stopEdgeScroll() { cancelAnimationFrame(edgeRaf); edgeRaf = 0; edgeDir = 0; }

function doDelete(gone) {
  GROUPS.splice(gone, 1); counts.splice(gone, 1);
  for (const [item, gs] of assigned) {
    const next = new Set();
    for (const g of gs) { if (g === gone) continue; next.add(g > gone ? g - 1 : g); }
    assigned.set(item, next);
  }
  pos = wrapIndex(Math.min(gone, GROUPS.length - 1)); target = -1;
  renderWheel(); renderList(); updateProgress(); updateStats();
}

// ── 絞り込み ───────────────────────────────────────────────────────────
$('search').addEventListener('input', e => { query = e.target.value; renderList(); });
$('chipUn').addEventListener('click', e => {
  unassignedOnly = !unassignedOnly;
  e.currentTarget.classList.toggle('on', unassignedOnly);
  renderList();
});

// ── 計測 ───────────────────────────────────────────────────────────────
function measureRows() {
  const row = listEl.querySelector('.item');
  if (!row) { $('statRows').textContent = '0'; return; }
  const h = row.getBoundingClientRect().height + 8;
  const rows = Math.floor(listEl.clientHeight / h);
  $('statRows').textContent = String(rows);
  const hint = $('statHint');
  hint.textContent = rows <= 4 ? '狭い' : rows >= 7 ? '余裕あり' : 'ふつう';
  hint.className = rows <= 4 ? 'warn' : '';
}

let frames = 0, fpsT = performance.now();
(function tickFps() {
  frames++;
  const now = performance.now();
  if (now - fpsT >= 500) {
    const fps = Math.round(frames * 1000 / (now - fpsT));
    const el = $('statFps');
    el.textContent = String(fps);
    el.className = fps < 45 ? 'warn' : '';
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(tickFps);
})();

function updateStats() {
  $('statGroups').textContent = GROUPS.length;
  $('statItems').textContent = ITEMS.length;
  $('progTotal').textContent = ITEMS.length;
}

// 指を動かさずに「避ける」動きだけを見る。ドラッグと切り離して確かめられるようにする。
// 1つ隣へ動かすと避ける行は1つだけなので、3つ動かして複数行がずれるところを見せる。
function runDemo() {
  const rows = [...editList.children];
  if (rows.length < 4) return;
  const moving = rows[0];
  flipRows(() => {
    editList.insertBefore(moving, rows[3].nextSibling);
    GROUPS.splice(3, 0, GROUPS.splice(0, 1)[0]);
    counts.splice(3, 0, counts.splice(0, 1)[0]);
  });
}
$('segDemo').addEventListener('click', () => {
  // 閉じた状態から押されたら、画面がせり上がり切ってから動かす。
  // 同時に走らせると、せり上がりに紛れて「もう並び替わった状態」しか見えない。
  if (editPage.classList.contains('on')) return runDemo();
  openEdit();
  setTimeout(runDemo, 380);
});

function paintMotionState() {
  const el = $('motionState');
  if (!prefersReduce) { el.textContent = '端末は通常（全部動く）'; el.style.color = '#86efac'; }
  else if (forceMotion) { el.textContent = '端末は「減らす」→ 強制ON中'; el.style.color = '#fcd34d'; }
  else { el.textContent = '「減らす」ON → 並べ替えは180msで残す', el.style.color = '#fcd34d'; }
  $('segMotion').classList.toggle('on', forceMotion);
  $('segMotion').style.display = prefersReduce ? '' : 'none';
}
$('segMotion').addEventListener('click', () => {
  forceMotion = !forceMotion;
  applyMotionMode();
  paintMotionState();
});
paintMotionState();

$('segAuto').addEventListener('click', e => {
  focusFollow = !focusFollow;
  e.currentTarget.classList.toggle('on', focusFollow);
  if (!focusFollow) setState('open');
});
$('probeToggle').addEventListener('click', e => {
  const p = $('probe');
  p.classList.toggle('min');
  e.currentTarget.textContent = p.classList.contains('min') ? '開く' : '閉じる';
});

// ── 起動 ───────────────────────────────────────────────────────────────
// 何もしていない画面では判断できないので、少し振り分けた状態から始める
[['牛バラ',2],['豚バラ',0],['鶏もも',0],['サーモン',5],['キャベツ',3],['玉ねぎ',3],
 ['醤油',10],['味噌',0],['米',11],['生ビール樽',12],['牛乳',0],['卵',0]].forEach(([it, g]) => {
  const gs = new Set([g]); assigned.set(it, gs); counts[g]++;
});

$('wheelWrap').style.height = wheelH + 'px';
updateStats();
renderWheel();
renderList();
updateProgress();
window.addEventListener('resize', measureRows);
})();
</script>
</body>
</html>

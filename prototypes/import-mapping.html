/* ── 取込元を組み立てる ───────────────────────────────────── */
function buildSource() {
  SRC = SOURCES[state.srcKey]
  buildRows()
  // 取込先の既存マスタ。半分は既存（更新か変更なし）、半分は新規になる形にする
  EXISTING = new Map()
  if (SRC.real) {
    // 初めてこの帳票を入れる場面を見たいので、取込先は空にしておく
  } else
  for (let i = 0; i < Math.floor(state.nRows * 0.55); i++) {
    const r = makeRow(i)
    EXISTING.set(r.name, {
      price: (i % 3 === 0) ? String(Number(r.price) - 40) : r.price,
      unit: r.unit, category: r.category,
      axisA: (i % 5 === 0) ? '' : r.axisA,
    })
  }
  state.headerRow = null
  state.headerNamed = false
  state.sections = SRC.sections ?? 1
  state.sectionsMode = state.sections > 1 ? null : 1
  state.mapping = {}
  state.manual = {}
  state.picked = null
  state.grew = {}
  state.keepMeta = false
  state.splitByCode = false
  state.sortMode = 'file'
  state.closedGroups = {}
  state.recipe = null
  autoDetect()
}

function buildRows() {
  const rows = []
  // 表の前に乗っている前置き（発行日・店舗名・空行）。列数もそろっていない
  for (const pre of (SRC.preamble ?? [])) {
    rows.push(SRC.cols.map((_, c) => pre[c] ?? ''))
  }
  if (SRC.headers) rows.push(SRC.headers.slice())
  // 実物は全件出す。件数はファイルが決めるものなので、生成データ用の
  // 「行数」つまみで切ると、実ファイルの件数を偽ることになる。
  if (SRC.real) {
    for (const it of REAL_ITEMS) rows.push(SRC.cols.map(c => it[c] ?? ''))
    TABLE = rows
    return
  }
  for (let i = 0; i < state.nRows; i++) {
    if (SRC.junk) {
      const j = junkRow(i, SRC.cols)
      if (j) { rows.push(j.row); continue }
    }
    const r = dirty(i, makeRow(i))
    const cells = SRC.cols.map(c => r[c] ?? '')
    if (SRC.junk) {
      // 全角数字と、単位を巻き込んだ数量
      const pi = SRC.cols.indexOf('price')
      if (pi >= 0 && i % 9 === 4) cells[pi] = toWide(r.price)
      if (pi >= 0 && i % 13 === 6) cells[pi] = `¥${Number(r.price).toLocaleString()}`   // 通貨記号つき＝読める
      if (pi >= 0 && i % 17 === 11) cells[pi] = `${r.price} 円`                        // 空白混入＝読めない
      const qi = SRC.cols.indexOf('lotSize')
      if (qi >= 0 && i % 7 === 3) cells[qi] = `${r.lotSize}${r.unit}`
    }
    rows.push(cells)
  }
  TABLE = rows
}

/* ── 自動検出 ─────────────────────────────────────────────
   見出しがあると宣言されたときだけ効かせる。見出しの無いファイルで推測すると
   1行目のデータを列名と誤読する（既存実装と同じ規約）。 */
// 見出しの突き合わせは必ず正規化してから。実物の帳票は半角カナだらけで、
// 「商品ｺｰﾄﾞ」は「商品コード」を含まない（pdfTableParser は _norm で正規化済み）。
const norm = t => String(t ?? '').normalize('NFKC').trim().toLowerCase()
function autoDetect({ keepManual = false } = {}) {
  const head = hasHeader() ? (TABLE[state.headerRow] ?? []).map(norm) : []
  for (const f of fields()) {
    if (keepManual && state.manual[f.key]) continue    // 手で置いたものは残す
    let hit = null
    for (let i = 0; i < head.length; i++) {
      if (f.hints.some(h => head[i].includes(norm(h)))) { hit = i; break }
    }
    state.mapping[f.key] = hit
    state.manual[f.key] = false
  }
  // 見出しが無いときの品目名は既定で埋めない。「最初の品目名を選んでください」で
  // 明示的に訊く（推測を選択値にしない契約でもある）。
  // 自動で当てた列が他とぶつかっていたら、手で置いたほうを優先して外す
  if (keepManual) {
    const taken = new Set()
    for (const f of fields()) if (state.manual[f.key]) taken.add(state.mapping[f.key])
    for (const f of fields()) {
      if (!state.manual[f.key] && taken.has(state.mapping[f.key])) state.mapping[f.key] = null
    }
  }
}

const colCount = () => TABLE.reduce((n, r) => Math.max(n, r.length), 0)
// 列名として使えるのは、ユーザーが「この行が見出し」と選んだときだけ
const hasHeader = () => state.headerNamed && state.headerRow !== null && state.headerRow >= 0
// 見出し行より上（発行日・店舗名などの前置き）は取り込まない
const dataRows = () => TABLE.slice((state.headerRow ?? -1) + 1)
const headerName = i =>
  (hasHeader() ? (TABLE[state.headerRow]?.[i] ?? '').trim() : '') || `列${i + 1}`

// 数値セルの読み方。utils/csvParse.js の parseNumericCell を写している。
//   全角は半角へ ／ 先頭の通貨記号は1個だけ外す ／ 空白の混入は不正
//   （「1 2」を 12 にしない）／ 桁区切りは正しい形のときだけ外す
const _half = t => t.replace(/[０-９．，－]/g, c => '0123456789.,-'['０１２３４５６７８９．，－'.indexOf(c)])
function readNum(raw) {
  const original = String(raw ?? '').trim()
  if (original === '') return { empty: true }
  if (/\s/.test(original)) return { invalid: true }
  let t = _half(original).replace(/^[¥￥]/, '')
  if (/[¥￥]/.test(t)) return { invalid: true }
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '')
  else if (!/^-?\d+(\.\d+)?$/.test(t)) return { invalid: true }
  const n = Number(t)
  if (!Number.isFinite(n)) return { invalid: true }
  return { value: n }
}

// 品目ではない行。業者の帳票には必ず混ざる。
// pdfTableParser の _isMeta と同じ考え方を、CSVの経路にも持たせる。
const META_EXACT = new Set(['小計','合計','総計','計','以上','次頁','続き','小 計','合 計'])
function isMetaName(n) {
  const t = String(n).normalize('NFKC').trim()
  if (META_EXACT.has(t)) return true
  if (/^[【〔\[(（].*[】〕\])）]$/.test(t)) return true       // 【野菜】のような区分の見出し
  if (/^[-–—=・~〜\s]+$/.test(t)) return true                 // 区切りの罫線
  if (/^(発行日|取引先|お得意先|店舗|ページ|p\.?\d)/i.test(t)) return true
  return false
}
function metaReason(n) {
  const t = String(n).normalize('NFKC').trim()
  if (META_EXACT.has(t)) return '合計・小計の行に見えます'
  if (/^[【〔\[(（].*[】〕\])）]$/.test(t)) return '区分の見出しに見えます'
  return '品目ではない行に見えます'
}

/* ══════════════════════════════════════════════════════════════
   計画を組み立てる。
   本体では buildImportPlan（純関数）が同じ仕事をしている。実測は
     1000行 7.2ms / 3000行 16.9ms / 8000行 45.9ms（PC）
   なので、列を1本置くたびに丸ごと作り直して足りる。ここでも毎回全行を通す
   ── 端末での実コストを測るのが目的なので、手を抜くと数字が嘘になる。
   ══════════════════════════════════════════════════════════════ */
function buildPlan() {
  const t0 = performance.now()
  const m = state.mapping
  const rows = []
  const counts = { add: 0, upd: 0, same: 0, err: 0, skip: 0, meta: 0, collide: 0, split: 0, blank: 0 }
  const seen = new Map()   // 名前 → その行の商品コード

  if (m.name === null || m.name === undefined || state.headerRow === null) {
    lastPlanMs = performance.now() - t0
    return { rows: [], counts, ready: false }
  }

  const src = dataRows()
  const cell = (r, key) => {
    const i = m[key]
    if (i === null || i === undefined) return ''
    return String(r[i] ?? '').trim()
  }

  for (let k = 0; k < src.length; k++) {
    const r = src[k]
    const line = (state.headerRow ?? -1) + 2 + k
    const name = cell(r, 'name')

    if (!name) { counts.err++; rows.push({ line, status: 'err', msg: '品目名が空' }); continue }
    if (!state.keepMeta && isMetaName(name)) {
      counts.meta++
      rows.push({ line, name, status: 'meta', msg: metaReason(name) })
      continue
    }
    if (seen.has(name)) {
      // 帳票側で名前が切り詰められると、サイズ違いの別商品が同名になる。
      // コードが違うなら別物なので、名前で潰す前にそう言う。
      const code = cell(r, 'code')
      const prevCode = seen.get(name)
      if (has('code') && code && prevCode && code !== prevCode) {
        if (state.splitByCode) {
          const uniq = `${name}（${code}）`
          counts.split++
          const vals = {}
          for (const f of fields()) if (f.key !== 'name') vals[f.key] = cell(r, f.key)
          rows.push({ line, name: uniq, vals, status: 'add', diff: null, renamed: name })
          counts.add++
          seen.set(uniq, code)
          continue
        }
        counts.collide++
        rows.push({ line, name, status: 'collide', msg: `同じ名前で商品コードが違います（${prevCode} と ${code}）` })
        continue
      }
      counts.skip++; rows.push({ line, name, status: 'skip', msg: 'ファイル内の重複（先の行を採用）' })
      continue
    }
    seen.set(name, cell(r, 'code'))

    const vals = {}
    for (const f of fields()) if (f.key !== 'name') vals[f.key] = cell(r, f.key)

    // 数値として読めない値は「既存値を残す」ではなく行エラーにする（IMPORT-001の契約）。
    // 判定は本体の parseNumericCell と同じ規則にする。対象も本体と同じで、
    // 数値検証があるのは単価だけ。入数・前月実績は文字列のまま入る（実物の帳票では
    // 入数の欄に S / M / L が入っており、いまの本体はそれを黙って受け取る）。
    // 読めない値は、その欄だけ空にして行は取り込む。
    // 単価のセル1つで品目そのものが消えると、品目名も単位もコードも正常なのに
    // 失われる。黙って壊さない契約は「空にしたことを必ず言う」で守る。
    const blanked = []
    for (const key of ['price', 'qty']) {
      const v = vals[key]
      if (!v) continue
      const r = readNum(v)
      if (r.invalid) { blanked.push({ key, raw: v }); vals[key] = ''; continue }
      vals[key] = r.empty ? '' : String(r.value)   // 全角・通貨記号・桁区切りをそろえて持つ
    }
    if (blanked.length) counts.blank += blanked.length

    const prev = EXISTING.get(name)
    let status = 'add', diff = null
    if (prev) {
      diff = {}
      for (const key of ['price', 'unit', 'category', 'axisA']) {
        const nv = vals[key]
        if (nv && nv !== (prev[key] ?? '')) diff[key] = prev[key] ?? ''
      }
      status = Object.keys(diff).length ? 'upd' : 'same'
    }
    counts[status === 'add' ? 'add' : status === 'upd' ? 'upd' : 'same']++
    rows.push({ line, name, vals, status, diff, blanked: blanked.length ? blanked : null })
  }

  lastPlanMs = performance.now() - t0
  return { rows, counts, ready: true }
}

/* ══════════════════════════════════════════════════════════════
   描画
   ══════════════════════════════════════════════════════════════ */
const RENDER_MAX = 40      // 画面に出す行。計画は全行、描画は先頭だけ
const pdfPages = () => SRC.pages ?? 3
const has = k => state.mapping[k] !== null && state.mapping[k] !== undefined
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))

function render(opts = {}) {
  const t0 = performance.now()
  PLAN = buildPlan()

  // 段：まだ答えの出ていない「必須の問い」があるなら、それを1つだけ訊く。
  // 訊く数はファイルが決める。よく出来たファイルなら1問で終わる。
  const q = nextQuestion()
  const asking = !!q
  $('ask').hidden = !asking
  $('map').hidden = asking
  $('foot').hidden = asking

  if (asking) { renderAsk(q); autoPan() }
  else {
    cancelAnimationFrame(_panRaf)
    renderMap()
    renderFoot()
    const pdf = SRC.mode === 'pdf'
    // PDFに1行目という概念は無いので出さない
    $('msheetHead').hidden = pdf
    if (!pdf) $('msheetHead').textContent = hasHeader()
      ? `${state.headerRow + 1}行目が見出し ・ 変える`
      : `${state.headerRow + 2}行目からデータ ・ 変える`
    const used = fields().filter(f => has(f.key)).length
    const miss = fields().filter(f => f.required && !has(f.key))
    $('msheetT').innerHTML = miss.length
      ? `<span class="map-warn">${esc(miss.map(f => f.label).join('・'))}が未指定</span>`
      : `${used}項目${pdf ? ` ・ ${pdfPages()}ページ${state.sections > 1 ? `・${state.sections}段` : ''}` : ''}`
  }
  renderRcpBand()
  // 表はプレビューの中にあるので、開いているときだけ組み直す
  if (!$('pv').hidden) { renderTable(opts); renderSorts(); renderPvFoot() }
  lastDrawMs = performance.now() - t0
  renderProbeNums()
}

/* ══════════════════════════════════════════════════════════════
   全画面プレビュー。
   項目を決めるたびにフワッと出て、組み上がって、自分で消える。
   操作面（マッピング）は覆われるので、頻度は切り替えられるようにしてある
   ── 9項目あるファイルで毎回覆われると、手元が隠れてリズムが切れる。
   「プレビュー」から開いたときは居座り、並べ替えや開閉を実際に触れる。
   ══════════════════════════════════════════════════════════════ */
let _pvT = []
function clearPv() { for (const t of _pvT) clearTimeout(t); _pvT = [] }

function openPreview({ sticky = false, filled = null, full: forceFull = null, title = null } = {}) {
  clearPv()
  state.pvSticky = sticky
  const pv = $('pv')
  pv.hidden = false
  pv.classList.remove('out')
  pv.classList.add('in')
  $('pvClose').hidden = !sticky
  $('sorts').classList.toggle('locked', !sticky)
  $('pvT').textContent = sticky ? '取り込んだ後の棚卸カード'
    : (title ?? (filled ? `${fieldOf(filled)?.label ?? ''}が入りました` : '取り込んだ後の棚卸カード'))

  if (sticky) { state.reveal = null; renderTable(); renderSorts(); renderPvFoot(); return }

  // 組み上がりを見せる。初回は最後まで、2回目以降はいま決めた項目だけ。
  // 部品が1つずつ噛み合うのを見せたいので、列と列の間はゆったり取る。
  // 詰めると「全部いっぺんに出た」に見えて、組み立てにならない。
  // レシピが当たったときは、飛ばした分をここで一度だけ見せる。
  // 問いを1つも出さないなら、合っているかを確かめる場が他に無い。
  const full = forceFull ?? (state.tutorial === 'always' || (state.tutorial === 'first' && !state.seenBuild))
  const asm = state.fx === 3
  const GAP = asm ? 300 : 155          // 列と列の間
  const LEAD = asm ? 360 : 280         // 1本目までの間
  const steps = full
    ? [['name', 0], ...fields().filter(f => f.key !== 'name' && has(f.key)).slice(0, 6).map((f, i) => [f.key, LEAD + i * GAP])]
    : [[filled ?? 'name', 0]]
  state.reveal = new Set(['name'])
  renderTable({ filled: 'name' }); renderSorts(); renderPvFoot()
  for (const [key, at] of steps) {
    if (key === 'name') continue
    _pvT.push(setTimeout(() => {
      state.reveal.add(key)
      // 描き直さず、伏せてある部品にクラスを付けて出す。描き直すと
      // 前の列の動きが途中で消えて「嵌まる」ではなく「入れ替わる」に見える。
      revealParts(key)
      renderSorts(); renderPvFoot()
    }, at))
  }
  const done = steps[steps.length - 1][1] + (asm ? 620 : 420)
  _pvT.push(setTimeout(() => {
    state.seenBuild = true; state.reveal = null
    renderTable(); renderPvFoot({ countUp: true })
    if (asm) sweep()                   // 組み上がった全体を一度なぞる
  }, done))
  // 見せ終わったら自分で閉じる。閉じるまでの間（HOLD）が短いと読めない
  const HOLD = asm ? (full ? 1500 : 1000) : (full ? 900 : 700)
  _pvT.push(setTimeout(closePreview, done + HOLD))
  // 触ったら止めて居座る（読みたい人を追い出さない）
  pv.addEventListener('pointerdown', stayPreview, { once: true })
}
function stayPreview() {
  clearPv()
  state.seenBuild = true
  state.reveal = null
  state.pvSticky = true
  $('pvClose').hidden = false
  $('sorts').classList.remove('locked')
  $('pvT').textContent = '取り込んだ後の棚卸カード'
  renderTable(); renderSorts(); renderPvFoot()
}
function closePreview() {
  clearPv()
  const pv = $('pv')
  pv.removeEventListener('pointerdown', stayPreview)
  state.reveal = null
  if (state.fx === 0 || reduced()) { pv.hidden = true; pv.classList.remove('in', 'out'); return }
  pv.classList.remove('in'); pv.classList.add('out')
  setTimeout(() => { pv.hidden = true; pv.classList.remove('out') }, 260)
}
/* ══════════════════════════════════════════════════════════════
   マッピング面。前の画面で見ていた元データをそのまま出し続け、
   その上に「どの列がどの項目か」を色で書く。
   列チップは元データの作り直しでしかないので置かない ── 見ていたものが
   消えて別の抽象に置き換わると、そこで一度分からなくなる。
   ══════════════════════════════════════════════════════════════ */
function renderMap() {
  const n = colCount()
  const byCol = {}
  for (const f of fields()) if (has(f.key)) byCol[state.mapping[f.key]] = f
  const MAP_ROWS = 40      // 面が縦に広いので多めに出す。足りないと下に白が残る
  const rows = dataRows().slice(0, MAP_ROWS)

  const headCell = (i) => {
    const f = byCol[i]
    const on = state.pickCol === i
    return `<span class="peek-c mc${f ? ' mapped' : ''}${on ? ' picking' : ''}" data-col="${i}"
      style="${f ? `--fc:${f.color};--fw:${f.weak}` : ''}">
      <span class="mc-no">${i + 1}</span>
      <span class="mc-src">${esc(headerName(i))}</span>
      <span class="mc-f">${f ? esc(f.label) : '<span class="mc-none">使わない</span>'}</span>
    </span>`
  }
  const dataCell = (v, i) => {
    const f = byCol[i]
    return `<span class="peek-c mc${f ? ' mapped' : ''}${state.pickCol === i ? ' picking' : ''}" data-col="${i}"
      style="${f ? `--fc:${f.color};--fw:${f.weak}` : ''}">${esc(String(v ?? '').trim()) || '&nbsp;'}</span>`
  }
  $('mapPeek').innerHTML = `<div class="peek-body" data-cols="${n}">
    <div class="peek-row peek-head mhead">
      <span class="peek-no"></span>
      <span class="peek-cells">${Array.from({ length: n }, (_, i) => headCell(i)).join('')}</span>
    </div>
    ${rows.map((r, i) => `<div class="peek-row rest">
      <span class="peek-no">${i + 1}</span>
      <span class="peek-cells">${Array.from({ length: n }, (_, c) => dataCell(r[c], c)).join('')}</span>
    </div>`).join('')}
  </div>`

  const unused = Array.from({ length: n }, (_, i) => i).filter(i => !byCol[i])
  $('unusedn').textContent = unused.length ? `使わない列 ${unused.length}` : '全部の列を使用中'

  // 列をタップしたら、その場で項目を選ばせる（PdfColumnMapper と同じやり方）
  const fb = $('fbar')
  if (state.pickCol === null || state.pickCol === undefined) fb.hidden = true
  else {
    fb.hidden = false
    const cur = byCol[state.pickCol]
    fb.innerHTML = `<div class="fbar-t">「${esc(headerName(state.pickCol))}」は何の項目？</div>
      <div class="fbar-chips">${fields().map(f => `
        <button class="fchip${cur?.key === f.key ? ' on' : ''}" data-f="${f.key}"
          style="--fc:${f.color}">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</button>`).join('')}
        <button class="fchip none" data-f="">使わない</button>
      </div>`
  }

  // まだ決まっていない項目。必須は目立たせる。
  const open = fields().filter(f => !has(f.key))
  $('mapCapT').textContent = state.replacing
    ? `「${fieldOf(state.replacing).label}」に入れる列をタップ`
    : (state.pickCol !== null ? '項目を選んでください' : 'どの列が何かを決めます')
  $('todo').innerHTML = open.length
    ? `<span class="todo-t">まだ決まっていない</span>` + open.map(f =>
        `<button class="tchip${f.required ? ' req' : ''}${state.replacing === f.key ? ' waiting' : ''}" data-todo="${f.key}" style="--fc:${f.color}">${esc(f.label)}</button>`).join('')
    : `<span class="todo-ok">✓ ${fields().length}項目ぜんぶ決まりました</span>`
}

/* 並び替えタブ。実物の棚卸カードと同じ並び方を、居座るプレビューでは実際に効かせる。
   「取り込んだ後どう見えるか」の確認なので、触れないと確認にならない。 */
function renderSorts() {
  // 既定は「取込順」＝ファイルの並びのまま。直前まで見ていたファイルと
  // 1行目が違うと、合っているかを確かめようがない。並べ替えは、
  // 確かめ終わったあとに自分で選ぶもの。
  const tabs = [{ k: 'file', label: '取込順', on: true },
                { k: 'genre', label: 'ジャンル', on: has('category') }]
  if (has('axisA')) tabs.push({ k: 'axisA', label: fieldOf('axisA').label, on: true })
  if (has('axisB')) tabs.push({ k: 'axisB', label: fieldOf('axisB').label, on: true })
  tabs.push({ k: 'name', label: '五十音', on: true })
  const usable = tabs.filter(t => t.on)
  if (!usable.some(t => t.k === state.sortMode)) state.sortMode = usable[0]?.k ?? 'name'
  $('sorts').innerHTML = usable.map(t =>
    `<button class="seg${t.k === state.sortMode ? ' on' : ''}" data-sort="${t.k}">${esc(t.label)}</button>`).join('')
}

/* 伏せてある部品を、上から順に嵌めていく。DOMは作り直さない。 */
function revealParts(key) {
  const t = $('inv')
  const asm = state.fx === 3
  const stg = asm ? 34 : Math.max(12, state.stagger)
  const ms  = asm ? 460 : 300
  // 見出しが先に降りて蓋をし、そのあと値が入る
  const th = t.querySelector(`thead th[data-fk="${key}"]`)
  if (th) {
    th.classList.remove('pend')
    th.classList.add(asm ? 'asm-th' : 'colgrow')
    if (asm) th.classList.add('asm-lock')
    th.addEventListener('animationend', () => th.classList.remove('asm-th', 'colgrow', 'asm-lock'), { once: true })
  }
  const cells = [...t.querySelectorAll(`tbody [data-fk="${key}"]`)]
  cells.forEach((el, i) => {
    el.classList.remove('pend')
    const inner = el.matches('td') ? (el.firstElementChild || el) : el
    inner.style.animationDelay = `${Math.min(i * stg, asm ? 1200 : 900)}ms`
    inner.style.setProperty('--asm-ms', ms + 'ms')
    inner.style.setProperty('--rise-ms', ms + 'ms')
    inner.classList.add(asm ? 'asm' : 'rise')
    inner.addEventListener('animationend', () => inner.classList.remove('asm', 'rise'), { once: true })
  })
  // 振り分けの列は軸をまとめて1セルに出しているので、そこだけ組み直す
  if (key === 'axisA' || key === 'axisB') { renderTable({ filled: key }) }
}

// 組み上がった全体を一度なぞる光。最後の1回だけ。
function sweep() {
  const card = $('pv').querySelector('.pv-card')
  if (!card) return
  const el = document.createElement('div')
  el.className = 'asm-sweep'
  card.style.position = 'relative'
  card.appendChild(el)
  el.addEventListener('animationend', () => el.remove(), { once: true })
}

function renderPvFoot({ countUp = false } = {}) {
  const c = PLAN.counts
  const total = c.add + c.upd + c.same
  const ex = c.err + c.skip + c.meta + c.collide
  $('pvFoot').innerHTML = `<b id="pvN">${total.toLocaleString()}</b>件が入ります`
    + ` ・ 新規 <b>${c.add.toLocaleString()}</b>`
    + (c.upd ? ` ・ 更新 <b>${c.upd.toLocaleString()}</b>` : '')
    + (ex ? ` ・ 除外 <b>${ex.toLocaleString()}</b>` : '')
    + (c.blank ? ` ・ 読めず空 <b>${c.blank.toLocaleString()}</b>` : '')
  // 数字は最後に一度だけ回す。毎回回すと、組み立ての最中ずっと落ち着かない
  if (countUp && state.fx === 3 && !reduced() && total > 0) countTo($('pvN'), total, 620)
}
function countTo(el, to, ms) {
  if (!el) return
  const t0 = performance.now()
  const ease = t => 1 - Math.pow(1 - t, 3)
  const step = (now) => {
    const t = Math.min(1, (now - t0) / ms)
    el.textContent = Math.round(to * ease(t)).toLocaleString()
    if (t < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

/* ══════════════════════════════════════════════════════════════
   ① 必須の問いを1つずつ。
   自動検出で確信をもって決まったものは訊かない ── 訊く数を決めるのは
   ファイルであって、画面の都合ではない。見出しのある普通のCSVなら1問で終わる。
   ══════════════════════════════════════════════════════════════ */
// 見出しらしい行を探す。CsvMapperModal の HEADER_WORDS と同じ考え方で、
// 「参考として出すだけ・選択値にはしない」を守る。
const HEADER_WORDS = ['品目','商品','品名','名称','単位','単価','価格','金額','原価','分類',
  'カテゴリ','コード','入数','数量','前月','仕入先','場所','name','item','unit','price','code']
function looksHeader(cells) {
  const filled = (cells ?? []).map(c => norm(c)).filter(Boolean)
  if (filled.length < 2) return false
  if (filled.every(c => /^[-0-9.,¥￥]+$/.test(c))) return false
  return filled.filter(c => HEADER_WORDS.some(w => c.includes(norm(w)))).length >= 2
}
// 表が1行目から始まっていないファイルでは、2択そのものが成り立たない
// （1行目は見出しでもデータでもなく、社名や発行日だから）。行を選ばせる形に変える。
const SCAN_ROWS = 14  // 見出しを探して出す行数
// 見出しらしい行の見当。**印を付けるためだけに使い、問いの形は変えない。**
function guessHeaderRow() {
  for (let i = 0; i < Math.min(SCAN_ROWS, TABLE.length); i++) if (looksHeader(TABLE[i])) return i
  return -1
}

function nextQuestion() {
  // 1ページに2ページ分入っている帳票。段を分けずに読むと、右側が消えるか
  // 左の列へ吸い込まれて値が壊れる。先に何枚の表かを確かめる。
  if (state.sectionsMode === null) return { kind: 'sections' }
  if (state.headerRow === null) return { kind: 'headerRow', guess: guessHeaderRow() }
  // 見出しが無いと答えたときだけ、続けて「最初の品目名」を訊く。
  // セルを1つ押せば、品目名の列と、データが始まる行の両方が決まる。
  if (state.headerRow === -1 && !has('name')) return { kind: 'firstItem' }
  const miss = fields().find(f => f.required && !has(f.key))
  if (miss) return { kind: 'field', field: miss }
  return null
}

function renderAsk(q) {
  $('askSub').textContent = `${SRC.filename} ・ ${TABLE.length.toLocaleString()}行`
  if (q.kind === 'headerRow') {
    // いつも同じ問いから始める。ファイルの形で画面が変わると、使うたびに
    // 「今回はどの画面だっけ」から始まることになる。
    $('askQ').textContent = '見出しの行を選んでください'
    $('peek').className = 'peek rowpick'
    $('peek').innerHTML = peekPickRows(q.guess)
    $('askOpts').innerHTML = ''
    $('askNote').innerHTML = '<span class="ask-note-t">列の名前（品名・単価…）が並んでいる行をタップします。</span>'
      + `<button class="ask-back" id="askNoHead">見出しの行はありません</button>`
  } else if (q.kind === 'firstItem') {
    // 見出しが無いファイル。1つのセルで「どの列が品目名か」と
    // 「どの行からデータか」が同時に決まる。
    $('askQ').textContent = '最初の品目名を選んでください'
    $('peek').className = 'peek cellpick'
    $('peek').innerHTML = peekPickCells()
    $('askOpts').innerHTML = ''
    $('askNote').innerHTML = '<span class="ask-note-t">1件目の品目の名前をタップします。その列が品目名になり、そこから下がデータになります。</span>'
      + `<button class="ask-back" id="askBackHead">見出しの行を選び直す</button>`
  } else if (q.kind === 'sections') {
    // 段数はパーサが数えている（商品名の見出しがいくつあるか）。自動解析は
    // 段数に依存しないので、2段だけを想定した2択にはしない。
    // 訊いているのは「その数で合っているか」であって、ゼロから選ばせるのではない。
    const det = SRC.sections ?? 1
    const per = Math.round(dataRows().length / det)   // 1段あたりの件数
    $('askQ').textContent = 'この紙、表は何枚ありますか？'
    $('peek').className = 'peek'
    $('peek').innerHTML = peekSections(det)
    $('askOpts').innerHTML = `<div class="secpick">${[1, 2, 3, 4].map(n => `
      <button class="secbtn${n === det ? ' det' : ''}" data-sec="${n}">
        <span class="secbtn-n">${n}</span>
        <span class="secbtn-c">${(per * n).toLocaleString()}件</span>
        ${n === det ? '<span class="secbtn-tag">自動判定</span>' : ''}
      </button>`).join('')}</div>`
    $('askNote').textContent = `同じ形の表が横に並んでいる数です。${det}枚と読み取りました。`
      + '違っていればここで直せます。少なく選ぶと、その分の品目は取り込まれません。'
  } else {
    // 列を選ぶ問い。選択肢を並べるのではなく、ファイルの列そのものを押させる。
    $('askQ').textContent = `どの列が「${q.field.label}」ですか？`
    $('peek').className = 'peek pickable'
    $('peek').innerHTML = peekCols()
    $('askOpts').innerHTML = ''
    $('askNote').innerHTML = `<span class="ask-note-t">上の表で、その列のどこかをタップしてください。</span>`
      + `<button class="ask-back" id="askBack">${hasHeader()
          ? `${state.headerRow + 1}行目を見出し` : `${state.headerRow + 2}行目からデータ`}として読んでいます ・ 変える</button>`
  }
}

// ファイルの先頭を、そのままの並びで見せる
const PEEK_N = 14     // 出す行数。縦にスクロールして残りも見られる
// 列は全部出して横に流す。切り捨てると、隠れた側にある判断材料が見えない
function peekCells(cells, n) {
  return Array.from({ length: n }, (_, i) =>
    `<span class="peek-c">${esc(String(cells[i] ?? '').trim()) || '&nbsp;'}</span>`).join('')
}
function peekRows({ markFirst = false } = {}) {
  const n = colCount()
  const rows = TABLE.slice(0, PEEK_N)
  return `<div class="peek-cap">ファイルの中身<span class="peek-hint" id="peekHint">${n}列</span></div>
    <div class="peek-body" data-cols="${n}">${rows.map((r, i) => `
      <div class="peek-row ${markFirst && i === 0 ? 'first' : 'rest'}" data-r="${i}">
        <span class="peek-no">${i + 1}</span>
        <span class="peek-cells">${peekCells(r, n)}</span>
      </div>`).join('')}</div>`
}
// 紙の見た目を小さく出す。左右に同じ形の表が並んでいることが見えれば足りる。
function peekSections(n) {
  const cell = (t, w) => `<span class="sec-c" style="flex:${w}">${esc(t)}</span>`
  const tbl = (rows, head) => `<div class="sec-tbl">
    <div class="sec-row head">${head.map((h, i) => cell(h, i === 0 ? 2 : 1)).join('')}</div>
    ${rows.map(r => `<div class="sec-row">${r.map((c, i) => cell(c, i === 0 ? 2 : 1)).join('')}</div>`).join('')}
  </div>`
  const head = ['品名', '単位', '単価']
  const secs = Array.from({ length: n }, (_, s) =>
    tbl([0, 1, 2, 3].map(i => { const r = makeRow(s * 20 + i); return [r.name, r.unit, r.price] }), head))
  return `<div class="peek-cap">紙の見た目 ・ 1ページ目</div>
    <div class="sec-page">
      <div class="sec-meta">${esc(SRC.filename.replace(/\.pdf$/, ''))}　2026/09/01</div>
      <div class="sec-cols">${secs.join('<div class="sec-gap"></div>')}</div>
    </div>`
}

// 行を押させるとき。前置きが何行あるか分からないので、少し多めに出す。
// 「見出しらしい」行には印を付けるが、決めるのはユーザー（推測を選択値にしない）。
function peekPickRows(guess) {
  const rowsN = Math.min(SCAN_ROWS, TABLE.length)
  const n = colCount()
  return `<div class="peek-cap">ファイルの中身 ・ 行をタップ<span class="peek-hint" id="peekHint">${n}列</span></div>
    <div class="peek-body" data-cols="${n}">${TABLE.slice(0, rowsN).map((r, i) => `
      <div class="peek-row pick ${i === guess ? 'guess' : 'rest'}" data-row="${i}">
        <span class="peek-no">${i + 1}</span>
        <span class="peek-cells">${peekCells(r, n)}</span>
        ${i === guess ? '<span class="peek-tag">これ？</span>' : ''}
      </div>`).join('')}</div>`
}

// セルを1つ押させる。押したセルで「品目名の列」と「データの始まる行」が同時に決まる。
function peekPickCells() {
  const n = colCount()
  const rowsN = Math.min(PEEK_N, TABLE.length)
  return `<div class="peek-cap">ファイルの中身 ・ 1件目の品目名をタップ<span class="peek-hint" id="peekHint">${n}列</span></div>
    <div class="peek-body" data-cols="${n}">${TABLE.slice(0, rowsN).map((r, i) => `
      <div class="peek-row rest" data-row="${i}">
        <span class="peek-no">${i + 1}</span>
        <span class="peek-cells">${Array.from({ length: n }, (_, c) =>
          `<span class="peek-c cell" data-row="${i}" data-col="${c}">${esc(String(r[c] ?? '').trim()) || '&nbsp;'}</span>`).join('')}</span>
      </div>`).join('')}</div>`
}

// 列を押させるとき。列見出しの行を出し、押した列がどれか分かるようにする
function peekCols() {
  const n = colCount()
  const rows = dataRows().slice(0, PEEK_N)
  // 列番号を必ず出す。見出しの無いファイルでは、番号だけが列の名前になる
  const head = `<div class="peek-row peek-head"><span class="peek-no"></span><span class="peek-cells">${
    Array.from({ length: n }, (_, i) =>
      `<span class="peek-c" data-col="${i}"><span class="peek-cn">${i + 1}</span>${esc(headerName(i))}</span>`).join('')}</span></div>`
  return `<div class="peek-cap">ファイルの中身 ・ 列をタップ<span class="peek-hint" id="peekHint">${n}列</span></div>
    <div class="peek-body" data-cols="${n}">${head}${rows.map((r, i) => `
      <div class="peek-row rest"><span class="peek-no">${i + 1}</span><span class="peek-cells">${
        Array.from({ length: n }, (_, c) =>
          `<span class="peek-c" data-col="${c}">${esc(String(r[c] ?? '').trim()) || '&nbsp;'}</span>`).join('')
      }</span></div>`).join('')}</div>`
}

/* ファイルの中身を、一度だけ自動で横へ流して隠れている列を見せる。
   延々と動かすと読めないので往復1回で止める。触った時点で即やめて指に任せる。
   「視差効果を減らす」設定では動かさない（自分で動かせる状態にはしておく）。 */
let _panRaf = 0
function autoPan() {
  cancelAnimationFrame(_panRaf)
  const body = $('peek').querySelector('.peek-body')
  const hint = $('peekHint')
  if (!body) return
  const over = () => body.scrollWidth - body.clientWidth
  if (over() <= 8 || state.fx === 0 || reduced()) return

  let stopped = false
  const stop = () => {
    if (stopped) return
    stopped = true
    cancelAnimationFrame(_panRaf)
    hint?.classList.remove('moving')
    if (hint) hint.textContent = `${body.dataset.cols}列 ・ 横に動かせます`
  }
  for (const ev of ['pointerdown', 'wheel', 'touchstart']) body.addEventListener(ev, stop, { once: true, passive: true })

  // 速さではなく時間で決める。px/秒にすると、列の多いファイルほど延々と動く。
  const OUT = 2300, HOLD = 800, BACK = 520
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
  const total = OUT + HOLD + BACK
  let t0 = 0
  hint?.classList.add('moving')
  const step = (now) => {
    if (stopped) return
    if (!t0) t0 = now
    const t = now - t0
    const max = over()
    if (t < OUT)              body.scrollLeft = max * ease(t / OUT)
    else if (t < OUT + HOLD)  body.scrollLeft = max
    else if (t < total)       body.scrollLeft = max * (1 - ease((t - OUT - HOLD) / BACK))
    else { body.scrollLeft = 0; stop(); return }
    _panRaf = requestAnimationFrame(step)
  }
  // 画面が出た直後に動き出すと、読む前に動いて驚かせる。ひと呼吸置く
  setTimeout(() => { if (!stopped) _panRaf = requestAnimationFrame(step) }, 650)
}

// 選ぶ前に結果を出すため、その解釈で1回だけ組んでみる（状態は元に戻す）
function simulate(row) {
  const save = { h: state.headerRow, m: { ...state.mapping }, man: { ...state.manual } }
  state.headerRow = row
  autoDetect()
  const plan = buildPlan()
  state.headerRow = save.h; state.mapping = save.m; state.manual = save.man
  const first = plan.rows.find(r => r.status !== 'err' && r.status !== 'skip')
  return { ...plan, first: first?.name ?? '' }
}

/* ══════════════════════════════════════════════════════════════
   答えた直後に、表が組み上がるところを一度だけ見せる。
   これは飾りではなく説明で、「列を決めると表が育つ」という、このあと
   ずっと使う言葉をここで一度だけ教える。だから初回は最後まで、
   2回目以降は短くする（5回目の取込で待たされるのは説明ではなく邪魔）。
   ══════════════════════════════════════════════════════════════ */
function runBuild(filledKey) {
  if (state.fx === 0 || state.tutorial === 'off') { render({ filled: filledKey }); return }
  render()                 // 先にマッピング面を出してから、その上へ被せる
  openPreview({ filled: filledKey })
}


/* ── 組み上がる一覧 ────────────────────────────────────────
   実物の棚卸カード（InventoryTable.vue）と同じ形で出す。ここが違うと
   「取り込んだ後どう見えるか」の判断材料にならない。
   列を置くたびに列そのものが生え、分類を置くとジャンルの見出しが生える。 */
function renderTable(opts = {}) {
  const t = $('inv')
  if (!PLAN.ready) {
    t.innerHTML = `<tbody><tr><td style="padding:22px 14px;color:var(--faint);font-size:12.5px;text-align:center">
      ${state.headerRow === null ? '表の始まりを選ぶと、ここに結果が出ます' : '品目名の列を置くと、ここに結果が出ます'}
    </td></tr></tbody>`
    return
  }

  const master = isItemMaster()
  // 組み上がりの最中だけ、まだ出していない項目を伏せる（state.reveal が null なら全部出す）
  // 組み立て中も列は最初から在る（枠が先にできて、部品が後から嵌まる）。
  // まだ来ていない部品は pend で伏せておき、時が来たらクラスで出す。
  const rv = state.reveal
  const vis = k => has(k)
  const pend = k => (rv && !rv.has(k) ? ' pend' : '')
  const showCode  = master && vis('code')
  const showPrice = vis('price')
  const showQty   = vis('qty')
  const showDate  = vis('date')
  // 並び替えはプレビューのタブに従う。ジャンル以外を選んでいるときはその軸でまとめる
  const sortKey   = state.sortMode
  // 取込順＝ファイルの並びのまま。まとめも並べ替えもしない
  const groupBy   = sortKey === 'genre' ? 'category' : (sortKey === 'axisA' || sortKey === 'axisB') ? sortKey : null
  const grouped   = master && groupBy && vis(groupBy)

  // 湧き上がりの対象と1行あたりの遅れ
  const jf = opts.filled ?? null
  const asm = state.fx === 3                    // 強め＝組み立て
  const stg = state.fx === 0 ? 0 : state.fx === 1 ? 0 : (asm ? Math.max(state.stagger, 34) : state.stagger)
  const riseMs = state.fx === 0 ? 0 : state.fx === 1 ? 200 : state.fx === 2 ? 300 : 460
  let riseIdx = 0
  // class は必ずここで1つにまとめて返す。呼び出し側にも class を書くと
  // 属性が二重になり、後から書いたほうが捨てられる。
  const riseAttr = (key, extra = '') => {
    if (!jf || jf !== key || state.fx === 0) return extra ? ` class="${extra}"` : ''
    const d = Math.min(riseIdx++ * stg, asm ? 1200 : 900)
    const cls = asm ? 'asm' : 'rise'
    return ` class="${cls}${extra ? ' ' + extra : ''}" style="animation-delay:${d}ms;--asm-ms:${riseMs}ms;--rise-ms:${riseMs}ms;--rise:8px"`
  }
  // 列の見出しは上から降りてきて蓋をする。値より先に着く
  const growAttr = (key) => (state.grew[key] && state.fx > 0 ? (asm ? ' asm-th' : ' colgrow') : '')

  const head = []
  if (showCode) head.push(`<th data-fk="code" class="code${growAttr('code')}${pend('code')}" style="width:58px">コード</th>`)
  if (showDate) head.push(`<th data-fk="date" class="${pend('date').trim()}" style="width:80px">日付</th>`)
  head.push(`<th>品目</th>`)
  if (master) head.push(`<th class="qty" style="width:92px">振り分け</th>`)
  if (showQty) head.push(`<th data-fk="qty" class="qty${pend('qty')}" style="width:62px">数量</th>`)
  if (showPrice) head.push(`<th data-fk="price" class="amount${growAttr('price')}${pend('price')}" style="width:66px">単価</th>`)
  const ncols = head.length

  let body = ''
  let shown = 0, lastCat = null
  // 実物の棚卸カードはジャンルでまとまって出る。分類の列を置いた瞬間に
  // 行がその並びへ組み変わる、が「組み上がる」の見せどころになる。
  const bad = r => r.status === 'err' || r.status === 'skip' || r.status === 'meta' || r.status === 'collide'
  const ok = PLAN.rows.filter(r => !bad(r))
  const ng = PLAN.rows.filter(bad)
  const list = (grouped
    ? ok.slice().sort((a, b) => String(a.vals?.[groupBy] ?? '').localeCompare(String(b.vals?.[groupBy] ?? ''), 'ja'))
    : sortKey === 'name' ? ok.slice().sort((a, b) => a.name.localeCompare(b.name, 'ja')) : ok)
  // 良い行を先頭から RENDER_MAX 件、そのあとに取り込まない行を必ず付ける。
  // 単純に連結して打ち切ると、良い行が40件を超えた時点で break して
  // 「取り込まない行」に一生たどり着かない（除外 N › が空振りする）。
  const NG_MAX = 30
  const list2 = list.slice(0, RENDER_MAX).concat(ng.slice(0, NG_MAX))
  let ngOpened = false
  for (const r of list2) {
    if (bad(r) && !ngOpened) {
      ngOpened = true
      const metaN = ng.filter(x => x.status === 'meta').length
      const colN  = ng.filter(x => x.status === 'collide').length
      body += `<tr class="grp ng"><td colspan="${ncols}">
        <span class="arrow">▼</span>取り込まない行<span class="cnt">${ng.length}</span>
        ${colN ? `<button class="keepmeta" id="splitCode">同名${colN}件をコードで分けて登録</button>` : ''}
        ${metaN ? `<button class="keepmeta" id="keepMeta">小計・見出しの${metaN}行も品目にする</button>` : ''}
      </td></tr>`
    }
    if (!bad(r) && grouped && r.vals?.[groupBy] !== lastCat) {
      lastCat = r.vals?.[groupBy]
      const cnt = ok.filter(x => x.vals?.[groupBy] === lastCat).length
      const shut = !!state.closedGroups[lastCat]
      body += `<tr class="grp${growAttr(groupBy)}" data-grp="${esc(lastCat ?? '')}"><td colspan="${ncols}">
        <span class="arrow">${shut ? '▶' : '▼'}</span>${esc(lastCat || '（分類なし）')}<span class="cnt">${cnt}</span></td></tr>`
    }
    if (!bad(r) && grouped && state.closedGroups[r.vals?.[groupBy]]) continue
    shown++

    if (bad(r)) {
      const isErr = r.status === 'err'
      const isMeta = r.status === 'meta'
      const isCol = r.status === 'collide'
      body += `<tr class="${isErr ? 'st-err' : (isMeta || isCol) ? 'st-meta' : 'st-same'}" data-err="${isErr ? 1 : 0}">
        <td class="td-name" colspan="${ncols}">
          <div class="nm">
            <span class="rowtag ${isErr ? 'err' : (isMeta || isCol) ? 'meta' : 'same'}">${
              isErr ? '取り込めない' : isCol ? '別の商品かも' : isMeta ? '品目ではない' : '除外'}</span>
            <span style="color:var(--muted)">${r.name ? esc(r.name) : `${r.line}行目`}</span>
          </div>
          <div class="errmsg">${r.line}行目 ・ ${esc(r.msg)}</div>
        </td></tr>`
      continue
    }

    const tag = r.status === 'add' ? ['add', master ? '新規' : '新しい品目'] : null
    let tds = ''
    if (showCode) tds += `<td data-fk="code" class="td-code${growAttr('code')}${pend('code')}"><span${riseAttr('code')}>${esc(r.vals.code || '')}</span></td>`
    if (showDate) tds += `<td data-fk="date" class="td-code${pend('date')}"><span${riseAttr('date')}>${esc(r.vals.date || '')}</span></td>`

    const hints = []
    if (vis('unit') && r.vals.unit)           hints.push(`<span${riseAttr('unit', 'hint' + pend('unit'))}>単位: ${esc(r.vals.unit)}</span>`)
    if (vis('lotSize') && r.vals.lotSize)     hints.push(`<span${riseAttr('lotSize', 'hint lot' + pend('lotSize'))}>入数: ${esc(r.vals.lotSize)}</span>`)
    if (vis('prevMonth') && r.vals.prevMonth) hints.push(`<span${riseAttr('prevMonth', 'hint' + pend('prevMonth'))}>前月: ${esc(r.vals.prevMonth)}</span>`)
    if (vis('supplier') && r.vals.supplier)   hints.push(`<span${riseAttr('supplier', 'hint' + pend('supplier'))}>${esc(r.vals.supplier)}</span>`)
    tds += `<td class="td-name">
      <div class="nm">${tag ? `<span class="rowtag ${tag[0]}">${tag[1]}</span>` : ''}${esc(r.name)}${
        r.blanked ? `<span class="rowtag blank" title="読めなかったので空にしました">読めず空</span>` : ''}</div>
      ${hints.length ? `<div class="hints">${hints.join('')}</div>` : ''}
    </td>`

    if (master) {
      const gs = []
      if (vis('axisA') && !pend('axisA') && r.vals.axisA) gs.push(r.vals.axisA)
      if (vis('axisB') && !pend('axisB') && r.vals.axisB) gs.push(r.vals.axisB)
      tds += `<td class="td-qty"><span data-fk="axes"${riseAttr(vis('axisA') ? 'axisA' : 'axisB', 'pg')}>${
        gs.length ? gs.map(g => `<span class="pgchip">${esc(g)}</span>`).join('')
                  : '<span class="pgnone">未振り分け</span>'}</span></td>`
    }
    if (showQty) {
      const bq = r.blanked?.find(b => b.key === 'qty')
      tds += `<td data-fk="qty" class="td-qty${pend('qty')}"><span${riseAttr('qty', 'qtybox')}>${
        bq ? `<span class="blanked">空</span>` : esc(r.vals.qty || '')}</span></td>`
    }
    if (showPrice) {
      const was = r.diff?.price
      const bl = r.blanked?.find(b => b.key === 'price')
      tds += `<td data-fk="price" class="td-amount${growAttr('price')}${pend('price')}"><span${riseAttr('price', 'money')}>${
        bl ? `<span class="blanked" title="${esc(bl.raw)}">空</span><span class="blanked-raw">${esc(bl.raw)}</span>`
           : (was ? `<span class="was">¥${esc(was)}</span>` : '') + `<span class="now">¥${esc(r.vals.price || '')}</span>`}</span></td>`
    }
    body += `<tr class="st-${r.status}${r.blanked ? ' has-blank' : ''}">${tds}</tr>`
  }

  const restN = Math.max(0, ok.length - Math.min(ok.length, RENDER_MAX))
  if (restN > 0) {
    body += `<tr><td colspan="${ncols}" style="padding:10px 14px;text-align:center;color:var(--faint);font-size:11.5px">
      ほか ${restN.toLocaleString()}件（同じ形で入ります）</td></tr>`
  }
  if (ng.length > NG_MAX) {
    body += `<tr><td colspan="${ncols}" style="padding:9px 14px;text-align:center;color:var(--faint);font-size:11.5px">
      取り込まない行 ほか ${(ng.length - NG_MAX).toLocaleString()}件</td></tr>`
  }
  t.innerHTML = `<thead><tr>${head.join('')}</tr></thead><tbody>${body}</tbody>`

  // 組み立てのときは、噛み合った列の縁が一度光る（行を光らせるより部品感が出る）
  if (asm && jf) {
    const th = t.querySelector('thead th.asm-th')
    if (th) { th.classList.add('asm-lock'); th.addEventListener('animationend', () => th.classList.remove('asm-lock'), { once: true }) }
  } else if (state.fx === 3 && jf) {
    const trs = t.querySelectorAll('tbody tr.st-add, tbody tr.st-upd')
    for (let i = 0; i < Math.min(trs.length, 12); i++) {
      const tr = trs[i]
      tr.style.animationDelay = `${i * stg}ms`
      tr.classList.add('bump')
      tr.addEventListener('animationend', () => tr.classList.remove('bump'), { once: true })
    }
  }
  state.grew = {}
}

/* ── 下部サマリーバー ── */
function renderFoot() {
  const c = PLAN.counts
  const l1 = $('footl1'), l2 = $('footl2')
  if (!PLAN.ready) {
    l1.textContent = state.headerRow === null ? '表の始まりを選んでください' : '品目名の列を置いてください'
    l2.textContent = ''
    $('go').disabled = true
    return
  }
  const total = c.add + c.upd + c.same
  const rep = state.mode === 'replace'
  const master = isItemMaster()
  l1.innerHTML = `<span class="num">${total.toLocaleString()}</span>件が${master ? '入ります' : '記録されます'}`
    + (master ? `<button class="modelink${rep ? ' danger' : ''}" id="modelink">${rep ? '全入れ替え' : '追加・更新'} ▾</button>` : '')
  l2.innerHTML = [
    `<span class="n-add num">${master ? '新規' : '新しい品目'} ${c.add.toLocaleString()}</span>`,
    master ? `<span class="n-upd num">更新 ${c.upd.toLocaleString()}</span>` : '',
    // 除外の件数そのものを、その行へ飛ぶボタンにする（別ボタンを置かない）
    (c.err + c.skip + c.meta + c.collide) ? `<button class="n-err num errjump">除外 ${(c.err + c.skip + c.meta + c.collide).toLocaleString()} ›</button>` : '',
    c.blank ? `<button class="n-blank num blankjump">読めず空 ${c.blank.toLocaleString()} ›</button>` : '',
  ].filter(Boolean).join('<span class="sep">・</span>')
  $('go').disabled = total === 0
  $('go').textContent = master && rep ? '全入れ替え' : '取り込む'
  $('go').classList.toggle('danger', master && rep)
}

/* ══════════════════════════════════════════════════════════════
   割り当て
   ══════════════════════════════════════════════════════════════ */
// 列の割り当てを外す。「使わない」を選んだときに通る。
function unassign(fieldKey) {
  state.mapping[fieldKey] = null
  state.manual[fieldKey] = false
  state.picked = null
  state.pickCol = null
}

function assign(fieldKey, colIdx) {
  if (state.headerRow === null) { backToAsk(); return }
  const prev = state.mapping[fieldKey]
  // 同じ列を2つのフィールドへ同時に割り当てない（元の実装の select と同じ制約）
  for (const f of fields()) if (f.key !== fieldKey && state.mapping[f.key] === colIdx) { state.mapping[f.key] = null; state.manual[f.key] = false }
  state.mapping[fieldKey] = colIdx
  state.manual[fieldKey] = true
  state.picked = null
  state.replacing = null
  state.pickCol = null
  // 列が丸ごと生えるフィールドは、生えたことが分かるように印を付ける
  if (prev === null || prev === undefined) state.grew[fieldKey] = true
  if (fieldKey === 'axisA' || fieldKey === 'axisB') state.grew['sort'] = true

  render()
  // 項目を決めるたびにプレビューが出て、組み上がって、自分で消える。
  // 外したときは出さない（訂正のたびに手元を覆われると作業にならない）。
  if (state.fx > 0 && state.tutorial !== 'off') openPreview({ filled: fieldKey })
}

function startFps() { fpsN = 0; fpsT0 = performance.now(); const l = () => { fpsN++; fpsRaf = requestAnimationFrame(l) }; fpsRaf = requestAnimationFrame(l) }
function stopFps() {
  if (!fpsRaf) return
  cancelAnimationFrame(fpsRaf); fpsRaf = 0
  const dt = performance.now() - fpsT0
  if (dt > 200) $('mFps').textContent = Math.round(fpsN / (dt / 1000)) + ''
}

/* ══════════════════════════════════════════════════════════════
   PDF経路。座標を指す操作は別物だが、指したあとの画面は共通にする。
   （上＝取込元、中＝組み上がる結果、下＝実行）
   ══════════════════════════════════════════════════════════════ */
function renderPdf() {
  const page = $('pdfPage')
  const cols = SRC.cols
  const src = SRC.real ? REAL_ITEMS : null
  const xs = cols.map((_, i) => 24 + i * Math.floor(420 / cols.length))
  let html = ''
  SRC.headers.forEach((h, ci) => { html += `<div class="tok head" data-col="${ci}" style="left:${xs[ci]}px;top:14px">${esc(h)}</div>` })
  for (let i = 0; i < 12; i++) {
    const r = src ? src[i] : makeRow(i)
    if (!r) break
    cols.forEach((c, ci) => {
      const v = (c === 'price' && r[c]) ? '¥' + r[c] : (r[c] ?? '')
      html += `<div class="tok" data-col="${ci}" data-row="${i}" style="left:${xs[ci]}px;top:${38 + i * 20}px">${esc(String(v).slice(0, 14))}</div>`
    })
  }
  html += `<div class="tok" style="left:24px;top:284px;color:#94a3b8">— 1 / ${pdfPages()} ページ —</div>`
  page.innerHTML = html
}
function onPdfClick(e) {
  const tok = e.target.closest('.tok[data-col]')
  if (!tok) return
  const col = Number(tok.dataset.col)
  // CSVと同じ形にそろえる：列を選ぶ → その場で項目を選ぶ
  if (state.replacing) {
    const key = state.replacing
    state.replacing = null
    assign(key, col)
    return
  }
  state.pickCol = state.pickCol === col ? null : col
  render()
  markPdfCol()
  $('pdfHint').textContent = state.pickCol === null
    ? '読みたい数字をタップすると、その列がまるごと入ります'
    : `「${headerName(col)}」を選びました。下から項目を選んでください`
}

function markPdfCol() {
  const usedBy = {}
  for (const f of fields()) if (has(f.key)) usedBy[state.mapping[f.key]] = f
  $('pdfPage').querySelectorAll('.tok[data-col]').forEach(t => {
    const c = Number(t.dataset.col), f = usedBy[c]
    t.classList.toggle('incol', !!f)
    t.classList.toggle('hot', state.pickCol === c)
    t.style.setProperty('--fc', f ? f.color : 'transparent')
  })
}

/* ══════════════════════════════════════════════════════════════
   確認。案A=下部バーだけで1画面完結／案B=従来どおり確認を挟む。
   どちらでも「全入れ替え」と「未解決の衝突」だけは必ず一段挟む
   （重い決定が軽く見えるのを防ぐ。IMPORT-001 で決めた線）。
   ══════════════════════════════════════════════════════════════ */
function onGo() {
  const needsSheet = state.confirm === 'sheet' || state.mode === 'replace'
  if (needsSheet) openSheet()
  else finish()
}
function openSheet() {
  const c = PLAN.counts
  const rep = state.mode === 'replace'
  const gone = rep ? Math.max(0, EXISTING.size - (c.upd + c.same)) : 0
  $('sheet').innerHTML = `
    <div class="sheet-h">${rep ? '全入れ替えの確認' : '取込内容の確認'}</div>
    <div class="sheet-sub">${esc(SRC.filename)} ・ ${PLAN.rows.length.toLocaleString()}行</div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-n n-add">${c.add.toLocaleString()}</div><div class="kpi-l">新規</div></div>
      <div class="kpi"><div class="kpi-n n-upd">${c.upd.toLocaleString()}</div><div class="kpi-l">更新</div></div>
      <div class="kpi"><div class="kpi-n n-same">${c.same.toLocaleString()}</div><div class="kpi-l">変更なし</div></div>
      <div class="kpi"><div class="kpi-n n-err">${(c.err + c.skip).toLocaleString()}</div><div class="kpi-l">除外</div></div>
    </div>
    ${rep ? `<div class="sheet-block warn">
      <div class="sheet-block-t">この操作は既存の品目を削除します</div>
      <div class="sheet-block-b">ファイルに無い <b>${gone.toLocaleString()}件</b> が品目リストから消えます。
        発注点・振り分けもその品目のぶんは失われます。取込後すぐなら「取込前に戻す」で戻せます。</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="repok">
        <span>消えることを確認しました</span></label>
    </div>` : `<div class="sheet-block">
      <div class="sheet-block-t">ファイルに無い既存品目は残ります</div>
      <div class="sheet-block-b">追加・更新だけを行います。取込後すぐなら「取込前に戻す」で戻せます。</div>
    </div>`}
    ${c.err ? `<div class="sheet-block warn">
      <div class="sheet-block-t">取り込めない ${c.err}行</div>
      <div class="sheet-block-b">${PLAN.rows.filter(r => r.status === 'err').slice(0, 4)
        .map(r => `${r.line}行目 ・ ${esc(r.msg)}`).join('<br>')}${c.err > 4 ? `<br>ほか ${c.err - 4}行` : ''}</div>
    </div>` : ''}
    <div class="sheet-acts">
      <button class="btn-cancel" id="sCancel">戻る</button>
      <button class="btn-ok${rep ? ' danger' : ''}" id="sOk" ${rep ? 'disabled' : ''}>${rep ? '全入れ替えする' : '取り込む'}</button>
    </div>`
  $('mask').hidden = false
  $('sCancel').onclick = () => { $('mask').hidden = true }
  $('sOk').onclick = () => { $('mask').hidden = true; finish() }
  const rk = $('repok')
  if (rk) rk.onchange = () => { $('sOk').disabled = !rk.checked }
}
// 取り込んだ直後。ここが「レシピとして保存しますか」を訊ける唯一の場所で、
// 前もって訊くべきではない ── 合っていたと分かる前に名前を付けさせても、
// 何に名前を付けているのか本人にも分からない。
function finish() {
  const c = PLAN.counts
  $('app').querySelector('.done-card')?.remove()
  const el = document.createElement('div')
  el.className = 'done-card'
  const saved = !!state.recipe
  el.innerHTML = `
    <div class="done-t">${(c.add + c.upd + c.same).toLocaleString()}件を取り込みました</div>
    <div class="done-b">追加 ${c.add.toLocaleString()} ・ 更新 ${c.upd.toLocaleString()} ・ 変更なし ${c.same.toLocaleString()}。
      登録は ${(EXISTING.size + c.add).toLocaleString()}件になりました（試作なので実際には書き換えません）。</div>
    ${saved
      ? `<div class="done-acts"><button class="done-saved" disabled>✓ レシピ「${esc(state.recipe.name)}」で読みました</button></div>`
      : `<div class="done-b" style="margin-top:9px">この読み方を覚えておくと、次に同じ形のファイルを開いたとき、
           問いを1つも出さずにここまで来ます。</div>
         <div class="done-acts">
           <button class="done-skip" id="doneSkip">あとで</button>
           <button class="done-save" id="doneSave">この読み方を保存</button>
         </div>`}`
  $('app').appendChild(el)
  el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' })
  const fade = () => {
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260 }).onfinish = () => el.remove()
  }
  $('doneSkip') && ($('doneSkip').onclick = fade)
  $('doneSave') && ($('doneSave').onclick = openRcpSave)
  // 保存を訊いている間は消さない。消えてしまうと、その場で決められなかった人に
  // 二度目の入口が無い（⚙の一覧は保存済みしか出せない）。
  if (saved) setTimeout(fade, 2600)
}

/* ══════════════════════════════════════════════════════════════
   計測・切替パネル
   ══════════════════════════════════════════════════════════════ */
const reduced = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches
function renderProbeNums() {
  $('mPlan').textContent = lastPlanMs.toFixed(1) + 'ms'
  $('mDraw').textContent = lastDrawMs.toFixed(1) + 'ms'
  $('mRows').textContent = (TABLE.length ? dataRows().length : 0).toLocaleString()
    + (SRC?.real ? '（実物）' : '')

}

  set('pSrc', 'src', state.srcKey)

  $('pRowsNote').textContent = SRC?.real ? `実物 ${REAL_ITEMS.length.toLocaleString()}件（固定）` : ''

/* ══════════════════════════════════════════════════════════════
   起動・配線
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   レシピ（保存した読み方）
   同じ帳票は毎月同じ形で来る。だから2回目以降に人が答えることは
   1つも無いはずで、答えさせているうちは仕組みが仕事をしていない。

   本体には既に pdfProfiles.js があるが、指紋が「トークンのx座標」なので
   PDFにしか効かない。CSV/Excel には座標が無いので、ここでは
   **見出しの名前の集合**を指紋にする（見出しの無いファイルは列の形で見る）。
   一致判定は pdfProfiles と同じ Jaccard 0.6。しきい値を揃えておくと、
   「PDFでは当たるのにCSVでは当たらない」という説明できない差が出ない。
   ══════════════════════════════════════════════════════════════ */
const RCP_KEY = 'proto.importRecipes'
const RCP_MIN = 0.6

function rcpLoad() {
  try { const a = JSON.parse(localStorage.getItem(RCP_KEY) || '[]'); return Array.isArray(a) ? a : [] }
  catch (_) { return [] }
}
function rcpStore(list) {
  try { localStorage.setItem(RCP_KEY, JSON.stringify(list)) } catch (_) {}
}
function rcpUid() { return 'rc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) }

// いま開いているファイルの指紋。見出し行の位置はレシピ側が持っているので、
// 「その行を見出しとして見たらどう見えるか」を毎回作り直して比べる。
function fpOfFile(headerRow) {
  const head = headerRow >= 0 ? (TABLE[headerRow] ?? []).map(norm).filter(Boolean) : []
  const shape = headerRow >= 0 ? [] : (TABLE[headerRow + 1] ?? [])
    .map(c => { const v = norm(c); return !v ? '-' : /^[-0-9.,¥￥]+$/.test(v) ? 'n' : 't' })
  return { mode: SRC.mode, cols: colCount(), headerRow, head, shape }
}
function rcpJaccard(a, b) {
  const sa = new Set(a), sb = new Set(b)
  if (!sa.size || !sb.size) return 0
  let inter = 0
  for (const v of sa) if (sb.has(v)) inter++
  return inter / (sa.size + sb.size - inter)
}
function rcpScore(rec) {
  const fp = rec.fp
  if (!fp || fp.mode !== SRC.mode) return 0
  // 品目マスタのレシピを納品明細に当てない。列の形が偶然そろっても、
  // 覚えている項目がそもそも別物になる。
  if (rec.fields && rec.fields !== (isItemMaster() ? 'item' : 'delivery')) return 0
  const cur = fpOfFile(fp.headerRow)
  if (cur.cols !== fp.cols) return 0
  if (fp.head.length) return rcpJaccard(fp.head, cur.head)
  // 見出しの無いファイル。名前が無いので列の並び（文字／数字／空）で見る。
  // 名前で当てるより弱い根拠なので、点も割り引く。
  if (!fp.shape.length || !cur.shape.length) return 0
  const n = Math.max(fp.shape.length, cur.shape.length)
  let same = 0
  for (let i = 0; i < n; i++) if (fp.shape[i] === cur.shape[i]) same++
  return (same / n) * 0.9
}
function rcpBest() {
  let best = null
  for (const rec of rcpLoad()) {
    const s = rcpScore(rec)
    if (s >= RCP_MIN && (!best || s > best.score)) best = { rec, score: s }
  }
  return best
}

// いまの読み方をそのまま1枚にする。列は番号だけでなく見出しの名前も控える
// ── 来月そのファイルの列が1本増えても、名前が同じならそこへ付け直せる。
function rcpCapture(name) {
  const head = hasHeader() ? (TABLE[state.headerRow] ?? []).map(norm) : []
  const columns = []
  for (const f of fields()) {
    if (!has(f.key)) continue
    const col = state.mapping[f.key]
    columns.push({ field: f.key, col, head: head[col] ?? '' })
  }
  return {
    id: rcpUid(), name: name || SRC.filename, createdAt: new Date().toISOString(),
    file: SRC.filename, fields: isItemMaster() ? 'item' : 'delivery',
    fp: fpOfFile(state.headerRow),
    headerRow: state.headerRow, headerNamed: state.headerNamed,
    sections: state.sections, sectionsMode: state.sectionsMode,
    keepMeta: state.keepMeta, splitByCode: state.splitByCode, mode: state.mode,
    columns,
  }
}
function rcpSaveRec(rec) {
  const list = rcpLoad()
  // 同じ紙のレシピは置き換える。同じ帳票のレシピが2枚あると、
  // どちらが当たったのかを人が確かめられない。
  const i = list.findIndex(p => rcpScore(p) >= 0.95)
  if (i >= 0) list.splice(i, 1, rec); else list.push(rec)
  rcpStore(list)
  return rec
}
function rcpDelete(id) { rcpStore(rcpLoad().filter(p => p.id !== id)) }

function rcpApply(rec) {
  state.headerRow = rec.headerRow
  state.headerNamed = rec.headerNamed
  state.sections = rec.sections ?? 1
  state.sectionsMode = rec.sectionsMode ?? 1
  // 段を検出より少なく読むレシピなら、そのぶん品目が減る（試作なので行数で表す）
  const det = SRC.sections ?? 1
  if (!SRC.real && state.sections < det) { state.nRows = Math.round(state.nRows * state.sections / det); buildRows() }
  state.keepMeta = !!rec.keepMeta
  state.splitByCode = !!rec.splitByCode
  state.mode = rec.mode ?? 'merge'
  const head = (TABLE[rec.headerRow] ?? []).map(norm)
  for (const f of fields()) { state.mapping[f.key] = null; state.manual[f.key] = false }
  const n = colCount()
  for (const c of (rec.columns ?? [])) {
    if (!fieldOf(c.field)) continue
    let i = c.head ? head.indexOf(c.head) : -1     // 名前で探す。列が動いていても追える
    if (i < 0) i = c.col                            // 見出しが無いファイルは番号で
    if (typeof i !== 'number' || i < 0 || i >= n) continue
    state.mapping[c.field] = i
    state.manual[c.field] = true
  }
}

// レシピを外して、いつもの問いに戻す。当たったレシピが違ったときの唯一の出口。
function rcpDrop() {
  state.recipe = null
  state.headerRow = null
  state.headerNamed = false
  state.sectionsMode = (SRC.sections ?? 1) > 1 ? null : 1
  state.sections = SRC.sections ?? 1
  for (const f of fields()) { state.mapping[f.key] = null; state.manual[f.key] = false }
  clearPv(); $('pv').hidden = true
  render()
}

// ファイル名から名前の見当を作る。拡張子と、月ごとに変わる数字を落とす
// ── 「202708_棚卸.pdf」で保存すると、来月そのままでは名前が古くなる。
function rcpSuggestName() {
  let n = String(SRC.filename).replace(/\.[a-z0-9]+$/i, '')
  n = n.replace(/(19|20)[0-9]{2}[-_/年]?[0-9]{1,2}([-_/月]?[0-9]{1,2})?[日]?/g, '')
  n = n.replace(/(19|20)[0-9]{2}/g, '')          // 年だけ入っているもの
  n = n.replace(/[_\-\s]{2,}/g, '_').replace(/^[_\-\s]+|[_\-\s]+$/g, '')
  return n || SRC.filename
}

/* ── 保存シート ── */
function openRcpSave() {
  const cols = fields().filter(f => has(f.key))
  $('rcpSheet').innerHTML = `
    <div class="sheet-h">この読み方に名前を付けて保存</div>
    <div class="sheet-sub">次に同じ形のファイルを開いたとき、問いを飛ばしてこの読み方で読みます。</div>
    <input class="rcp-name" id="rcpName" type="text" maxlength="24" placeholder="例：東西酒販の請求書">
    <div class="rcp-what">${cols.map(f =>
      `<span class="wchip" style="--fc:${f.color};--fw:${f.weak}">${esc(headerName(state.mapping[f.key]))} → ${esc(f.label)}</span>`).join('')}</div>
    <div class="sheet-block">
      <div class="sheet-block-t">覚えるのは「読み方」だけです</div>
      <div class="sheet-block-b">どの行から表か、どの列が何か、${SRC.mode === 'pdf' ? '何段組みか、' : ''}小計行を入れるか
        ── ここまでを覚えます。品目の中身は覚えないので、来月の数字はそのまま新しい方が入ります。</div>
    </div>
    <div class="sheet-acts">
      <button class="btn-cancel" id="rcpCancel">やめる</button>
      <button class="btn-ok" id="rcpOk">保存する</button>
    </div>`
  $('rcpMask').hidden = false
  const inp = $('rcpName')
  inp.value = rcpSuggestName()
  setTimeout(() => { inp.focus(); inp.select() }, 60)
  $('rcpCancel').onclick = () => { $('rcpMask').hidden = true }
  $('rcpOk').onclick = () => {
    const rec = rcpSaveRec(rcpCapture(inp.value.trim()))
    state.recipe = rec
    $('rcpMask').hidden = true
    const card = $('app').querySelector('.done-card')
    if (card) {
      card.querySelector('.done-acts').outerHTML =
        `<div class="done-acts"><button class="done-saved" disabled>✓ 「${esc(rec.name)}」として保存しました</button></div>`
      setTimeout(() => card.remove(), 2400)
    }
    renderRcpBand()
  }
}

/* ── 保存済みの一覧（⚙から）── */
function openRcpList() {
  const list = rcpLoad()
  const rows = list.map(rec => {
    const hit = rcpScore(rec) >= RCP_MIN
    const n = (rec.columns ?? []).length
    return `<div class="rcp-row${hit ? ' hit' : ''}">
      <div class="rcp-row-b">
        <div class="rcp-row-t">${esc(rec.name)}</div>
        <div class="rcp-row-s">${esc(rec.file)} ・ ${rec.fp?.cols ?? '?'}列 ${n}項目${hit ? ' ・ いま開いているファイルに一致' : ''}</div>
      </div>
      ${hit && !state.recipe ? `<button class="rcp-use" data-use="${rec.id}">使う</button>` : ''}
      <button class="rcp-del" data-del="${rec.id}">削除</button>
    </div>`
  }).join('')
  $('rcpSheet').innerHTML = `
    <div class="sheet-h">保存したレシピ</div>
    <div class="sheet-sub">同じ形のファイルを開いたとき、自動で当たります。</div>
    ${list.length ? `<div class="rcp-list">${rows}</div>`
      : `<div class="rcp-empty">まだありません。取り込んだ後に「この読み方を保存」から作れます。</div>`}
    <div class="sheet-acts"><button class="btn-cancel" id="rcpCancel">閉じる</button></div>`
  $('rcpMask').hidden = false
  $('rcpCancel').onclick = () => { $('rcpMask').hidden = true }
  // 「使わない」で外したあと、同じ画面から入れ直せるようにする。
  // 外す道だけあって戻る道が無いと、外した瞬間にやり直しになる。
  $('rcpSheet').querySelectorAll('[data-use]').forEach(b => {
    b.onclick = () => {
      const rec = rcpLoad().find(r => r.id === b.dataset.use)
      if (!rec) return
      rcpApply(rec); state.recipe = rec
      $('rcpMask').hidden = true
      render()
      if (state.fx > 0 && state.tutorial !== 'off') {
        openPreview({ filled: 'name', full: true, title: `レシピ「${rec.name}」で読みました` })
      }
    }
  })
  $('rcpSheet').querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      rcpDelete(b.dataset.del)
      if (state.recipe?.id === b.dataset.del) state.recipe = null
      openRcpList(); renderRcpBand()
    }
  })
}

/* ── 帯 ── */
function renderRcpBand() {
  const on = !!state.recipe && !!PLAN?.ready
  $('rcp').hidden = !on
  if (!on) return
  const c = PLAN.counts
  $('rcpT').innerHTML = `レシピ「${esc(state.recipe.name)}」で <span class="rcp-n">${(c.add + c.upd + c.same).toLocaleString()}</span>件 読みました`
}

function reload() {
  buildSource()
  $('fname').textContent = SRC.filename
  const pdf = SRC.mode === 'pdf'
  // 見出し行を除いた実データの行数。headerRow が決まる前に dataRows() を呼ぶと
  // 見出しまで数えてしまうので、ファイルの構造から直接引く。
  const dataN = TABLE.length - (SRC.headers ? 1 : 0) - (SRC.preamble?.length ?? 0)
  $('fsub').textContent = pdf
    ? `${pdfPages()}ページ ・ ${dataN.toLocaleString()}行を検出`
    : `${dataN.toLocaleString()}行`
  $('srcPdf').hidden = !pdf
  // 見出しの有無はファイルの性質なので、無いと分かっているものは初期値を出さない。
  // ただし PDF は行の座標で読むため「1行目は見出し」を先に出しておく。
  // PDFは行の座標で読むので「1行目は何か」を訊く意味が無い。質問を飛ばして、
  // 代わりに「どの列を指すか」の面から始める。
  if (pdf) { renderPdf(); state.headerRow = 0; state.headerNamed = true; autoDetect() }
  state.reveal = null
  clearPv()
  $('pv').hidden = true

  // 保存した読み方が当たれば、問いは1つも出さない。同じ帳票を毎月入れる人にとって、
  // 2回目以降に答えることは本来1つも無い。
  const hit = rcpBest()
  if (hit) { rcpApply(hit.rec); state.recipe = hit.rec }
  render()
  if (pdf) markPdfCol()
  syncProbe()
  // 飛ばした分を一度だけ見せる。黙って埋まっているだけだと、
  // 合っているかを人が確かめられない。
  if (hit && state.fx > 0 && state.tutorial !== 'off') {
    openPreview({ filled: 'name', full: true, title: `レシピ「${hit.rec.name}」で読みました` })
  }
}

// ① 問いの答え。答えるたびに、その結果が表に効くところを一度見せてから次へ。
// 横スクロールのための指の動きを、行・列の選択として拾わない。
// 実物の帳票は9列あって横に流して読むので、これが無いと読もうとして選んでしまう。
let _peekDrag = null, _peekMoved = false
$('ask').addEventListener('pointerdown', e => {
  const body = e.target.closest('.peek-body')
  _peekMoved = false
  _peekDrag = body ? { x: e.clientX, y: e.clientY, sl: body.scrollLeft, st: body.scrollTop, body } : null
}, true)
$('ask').addEventListener('pointerup', e => {
  if (!_peekDrag) return
  const { x, y, sl, st, body } = _peekDrag
  _peekMoved = Math.hypot(e.clientX - x, e.clientY - y) > 8
    || Math.abs(body.scrollLeft - sl) > 2 || Math.abs(body.scrollTop - st) > 2
  _peekDrag = null
}, true)

$('ask').addEventListener('click', e => {
  if (_peekMoved && e.target.closest('.peek-body')) { _peekMoved = false; return }
  _peekMoved = false
  const sec = e.target.closest('[data-sec]')
  if (sec) {
    const det = SRC.sections ?? 1
    const pick = Number(sec.dataset.sec)
    state.sectionsMode = pick
    state.sections = pick
    // 検出より少なく読むなら、そのぶん品目が減る（試作なので行数で表す）
    if (pick < det) { state.nRows = Math.round(state.nRows * pick / det); buildRows() }
    render()
    return
  }
  // 行を押して「ここから表」を決める
  const prow = e.target.closest('.peek.rowpick .peek-row.pick')
  if (prow) {
    const i = Number(prow.dataset.row)
    prow.classList.add('chosen')
    $('peek').querySelectorAll('.peek-row.pick').forEach(r => {
      if (Number(r.dataset.row) < i) r.classList.add('lift')
    })
    setTimeout(() => { state.headerRow = i; state.headerNamed = true; autoDetect(); runBuild('name') }, state.fx > 0 ? 480 : 0)
    return
  }
  if (e.target.closest('#askNoHead')) {
    state.headerRow = -1
    state.headerNamed = false
    state.mapping = {}; state.manual = {}   // 見出しが無いので当たる対応は無い
    render(); return
  }
  if (e.target.closest('#askBackHead')) {
    state.headerRow = null
    state.headerNamed = false
    for (const f of fields()) { state.mapping[f.key] = null; state.manual[f.key] = false }
    render(); return
  }
  // 1件目の品目名のセル：その列が品目名、その行からデータ
  const cellPick = e.target.closest('.peek.cellpick .peek-c.cell')
  if (cellPick) {
    const row = Number(cellPick.dataset.row), col = Number(cellPick.dataset.col)
    cellPick.classList.add('chosen')
    state.headerRow = row - 1        // その行から下がデータ
    state.headerNamed = false        // 見出しとして選んだ行ではない
    state.mapping = {}; state.manual = {}
    state.mapping.name = col
    state.manual.name = true
    setTimeout(() => runBuild('name'), state.fx > 0 ? 320 : 0)
    return
  }
  // 前の問いへ戻る。段階的に出すことが片道の廊下になってはいけない
  if (e.target.closest('#askBack')) {
    state.headerRow = null
    for (const f of fields()) { state.mapping[f.key] = null; state.manual[f.key] = false }
    render()
    return
  }
  // 列を選ぶ問い：ファイルの列そのものを押させる
  const cell = e.target.closest('.peek.pickable .peek-c[data-col]')
  if (cell) {
    const q = nextQuestion()
    if (!q || q.kind !== 'field') return
    const col = Number(cell.dataset.col)
    $('peek').querySelectorAll(`.peek-c[data-col="${col}"]`).forEach(c => c.parentElement.parentElement.classList.add('peek-col', 'hot'))
    assignQuiet(q.field.key, col)
    setTimeout(() => runBuild(q.field.key), state.fx > 0 ? 260 : 0)
  }
})
// 問いへの答えとしての割り当て。演出は runBuild が持つのでここでは描き直さない
function assignQuiet(fieldKey, colIdx) {
  for (const f of fields()) if (f.key !== fieldKey && state.mapping[f.key] === colIdx) { state.mapping[f.key] = null; state.manual[f.key] = false }
  state.mapping[fieldKey] = colIdx
  state.manual[fieldKey] = true
  state.grew[fieldKey] = true
}
// ②→③ 要約の行が、そのまま直す入口
$('pvOpen').addEventListener('click', () => openPreview({ sticky: true }))
$('pvClose').addEventListener('click', closePreview)
$('sorts').addEventListener('click', e => {
  const b = e.target.closest('.seg'); if (!b) return
  state.sortMode = b.dataset.sort
  state.closedGroups = {}
  renderSorts(); renderTable()
})
$('out').addEventListener('click', e => {
  if (e.target.closest('#keepMeta'))  { state.keepMeta = true;  render(); renderTable(); renderPvFoot(); return }
  if (e.target.closest('#splitCode')) { state.splitByCode = true; render(); renderTable(); renderPvFoot(); return }
  if (!state.pvSticky) return
  const g = e.target.closest('tr.grp[data-grp]'); if (!g) return
  state.closedGroups[g.dataset.grp] = !state.closedGroups[g.dataset.grp]
  renderTable()
})
// 読み方を変えるときは、2択に潰さず最初の問いへ返す
$('msheetHead').addEventListener('click', () => {
  closePreview()
  state.headerRow = null
  render()
})
$('footl1').addEventListener('click', e => {
  if (e.target.closest('#modelink')) $('modeMask').hidden = false
})
$('footl2').addEventListener('click', e => {
  if (e.target.closest('.errjump')) jumpToError()
  if (e.target.closest('.blankjump')) jumpTo('tr.has-blank')
})
// レシピの帯：当たったものが違うときは、その場で外して問いに戻る
$('rcpOff').addEventListener('click', rcpDrop)
$('rcpMask').addEventListener('click', e => { if (e.target === $('rcpMask')) $('rcpMask').hidden = true })

$('modeClose').addEventListener('click', () => { $('modeMask').hidden = true })
$('modeMask').addEventListener('click', e => {
  const o = e.target.closest('.modeopt')
  if (o) { state.mode = o.dataset.m; $('modeMask').hidden = true; renderFoot(); return }
  if (e.target === $('modeMask')) $('modeMask').hidden = true
})

// マッピング面：列をタップ → 項目を選ぶ／残りの項目をタップ → その項目に入れる列を待つ
$('map').addEventListener('click', e => {
  if (_peekMoved && e.target.closest('.peek-body')) { _peekMoved = false; return }
  _peekMoved = false

  const fc = e.target.closest('.fchip')
  if (fc) {
    const col = state.pickCol
    state.pickCol = null
    if (!fc.dataset.f) {                       // 「使わない」＝その列の割り当てを外す
      for (const f of fields()) if (state.mapping[f.key] === col) unassign(f.key)
      render(); return
    }
    assign(fc.dataset.f, col)
    return
  }
  const td = e.target.closest('.tchip')
  if (td) { state.replacing = state.replacing === td.dataset.todo ? null : td.dataset.todo; state.pickCol = null; render(); return }

  const col = e.target.closest('.peek-c.mc')
  if (col) {
    const i = Number(col.dataset.col)
    if (state.replacing) {                     // 「この項目に入れる列」を待っている
      const key = state.replacing
      state.replacing = null
      assign(key, i)
      return
    }
    state.pickCol = state.pickCol === i ? null : i
    render()
  }
})
// 元データを横に流すための指の動きを、列の選択として拾わない
$('map').addEventListener('pointerdown', e => {
  const body = e.target.closest('.peek-body')
  _peekMoved = false
  _peekDrag = body ? { x: e.clientX, y: e.clientY, sl: body.scrollLeft, st: body.scrollTop, body } : null
}, true)
$('map').addEventListener('pointerup', e => {
  if (!_peekDrag) return
  const { x, y, sl, st, body } = _peekDrag
  _peekMoved = Math.hypot(e.clientX - x, e.clientY - y) > 8
    || Math.abs(body.scrollLeft - sl) > 2 || Math.abs(body.scrollTop - st) > 2
  _peekDrag = null
}, true)
$('srcPdf').addEventListener('click', onPdfClick)
$('go').addEventListener('click', onGo)
$('mask').addEventListener('click', e => { if (e.target === $('mask')) $('mask').hidden = true })
// 除外の件数から飛ぶときは、表があるプレビューを開いてからそこへ送る
function jumpToError() { jumpTo('tr.st-err, tr.st-meta, tr.grp.ng') }
function jumpTo(sel) {
  openPreview({ sticky: true })
  setTimeout(() => {
    const row = $('inv').querySelector(sel)
    row?.scrollIntoView({ behavior: 'smooth', block: 'center' })
    row?.animate([{ background: '#fef3c7' }, { background: '' }], { duration: 900 })
  }, 360)
}

$('gear').addEventListener('click', () => $('probe').classList.toggle('hide'))
$('pRcp').addEventListener('click', () => { $('probe').classList.add('hide'); openRcpList() })
$('probeX').addEventListener('click', () => $('probe').classList.add('hide'))
$('pSrc').addEventListener('click', e => {
  const b = e.target.closest('.pbtn'); if (!b) return
  state.srcKey = b.dataset.src; reload()
})
$('pRows').addEventListener('click', e => {
  const b = e.target.closest('.pbtn'); if (!b || b.disabled) return
  state.nRows = Number(b.dataset.rows); reload()
})
$('pFx').addEventListener('click', e => {
  const b = e.target.closest('.pbtn'); if (!b) return
  state.fx = Number(b.dataset.fx); syncProbe(); render()
})
$('pTut').addEventListener('click', e => {
  const b = e.target.closest('.pbtn'); if (!b) return
  state.tutorial = b.dataset.tut; state.seenBuild = false; syncProbe()
})
$('pConfirm').addEventListener('click', e => {
  const b = e.target.closest('.pbtn'); if (!b) return
  state.confirm = b.dataset.cf; syncProbe()
})
$('pStagger').addEventListener('input', e => {
  state.stagger = Number(e.target.value)
  $('pStaggerV').textContent = state.stagger + 'ms'
})
$('pReset').addEventListener('click', () => { state.seenBuild = false; reload() })
$('pAuto').addEventListener('click', () => { autoDetect(); render({ filled: 'name' }) })
$('pClear').addEventListener('click', () => {
  for (const f of fields()) { state.mapping[f.key] = null; state.manual[f.key] = false }
  state.picked = null; render()
})

reload()
$('probe').classList.remove('hide')   // 初回だけ開いておく（切替があることを知らせる）
</script>
</body>
</html>

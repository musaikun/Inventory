<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>取込マッピング検証</title>
<style>
/* ── 本体アプリのトークンをそのまま借りる ─────────────────────────
   目的は「実機で操作感と演出の強さを決める」こと。見た目が本体と違うと
   判断がずれるので、色・字面は style.css / InventoryTable.vue と同じものを使う。 */
:root {
  --primary: #2563eb;
  --primary-bright: #3b82f6;
  --primary-soft: #dbeafe;
  --primary-weak: #eff6ff;
  --primary-border: #bfdbfe;
  --primary-deep: #1d4ed8;
  --primary-mid: #93c5fd;
  --ink: #1e293b;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --line-soft: #eef2f6;
  --ground: #f8fafc;
  --surface: #ffffff;
  --danger: #dc2626;
  --danger-weak: #fef2f2;
  --danger-line: #fecaca;
  --amber-ink: #b45309;
  --amber-bg: #fffbeb;
  --amber-line: #fde68a;
  --ok: #16a34a;
  --ok-weak: #f0fdf4;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);

  /* フィールド色。PdfColumnMapper.vue が既に持っている割り当てをそのまま使う。
     CSV経路とPDF経路で同じ色にすると、覚えることが1組で済む。 */
  --f-name: #2563eb;
  --f-price: #059669;
  --f-unit: #7c3aed;
  --f-category: #d97706;
  --f-code: #0891b2;
  --f-lot: #4b5563;
  --f-prev: #9333ea;
  --f-axisA: #db2777;
  --f-axisB: #0d9488;
  --f-date: #0284c7;
  --f-qty: #db2777;

  --font: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
/* display を宣言した要素は hidden 属性（UAの display:none）に勝ってしまう。
   段ごとに出し分ける画面はどれも display を持つので、ここで一度に塞ぐ。 */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--ground);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

/* ── 画面の骨格 ─────────────────────────────────────────────
   どの取込元でも構造は同じ：
     [入力源] → [組み上がる結果] → [実行]
   上の段だけが取込元ごとに変わる（列チップ / PDFのページ）。
   下の2段は全経路で共通にする。覚えることを1回で済ませるため。 */
.app {
  height: 100dvh; height: 100vh;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
  background: var(--ground);
  position: relative; overflow: hidden;
}

/* ── ヘッダー ── */
.hd {
  flex-shrink: 0; height: 48px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 4px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.hd-back {
  border: none; background: none; color: var(--primary);
  font-size: 15px; font-weight: 700; padding: 8px 10px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.hd-file { flex: 1; min-width: 0; }
.hd-name {
  font-size: 13px; font-weight: 800; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hd-sub { font-size: 11px; color: var(--muted); }
.hd-gear {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; width: 34px; height: 34px; font-size: 15px;
  cursor: pointer; flex-shrink: 0;
}

/* ── ① 最初の1問 ──────────────────────────────────────────
   ここでは他に何も出さない。訊いていることが1つなら、画面も1つでいい。 */
.ask {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: 10px; padding: 22px 20px 40px;
}
.ask-q { font-size: 19px; font-weight: 800; line-height: 1.45; }
.ask-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.ask-opt {
  display: block; width: 100%; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 14px; padding: 14px 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, box-shadow .15s, transform .12s;
}
.ask-opt:active { transform: scale(.985); }
.ask-opt:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ask-opt-t { display: block; font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
/* 選択肢そのものが結果を名乗る。警告文より、この数字のほうが早く伝わる */
.ask-opt-r { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.ask-opt-r b { color: var(--primary); font-weight: 800; font-variant-numeric: tabular-nums; }
.ask-opt-r .lost { color: var(--danger); font-weight: 700; }
.ask-note { font-size: 11.5px; color: var(--faint); line-height: 1.6; margin-top: 2px; }
.ask-note-t { display: block; }

/* 読み込み元のファイルそのもの。question の真横に置く。 */
.peek {
  border: 1px solid var(--line); border-radius: 11px; overflow: hidden;
  background: var(--surface); margin: 2px 0 6px;
}
.peek-cap {
  font-size: 10px; font-weight: 800; color: var(--faint); letter-spacing: .06em;
  padding: 7px 11px 5px; background: var(--ground); border-bottom: 1px solid var(--line-soft);
}
/* 行ごとに別々のスクロールにすると列がずれるので、全行を1つの面に載せる */
.peek-body {
  /* 縦にも動かせる。4行では「このファイルで合っているか」の判断がつかない場面がある */
  overflow: auto; max-height: 210px;
  touch-action: pan-x pan-y; overscroll-behavior: contain;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.peek-body::-webkit-scrollbar { display: none; }
.peek-row {
  display: flex; align-items: stretch; border-bottom: 1px solid var(--line-soft);
  font-size: 11px; transition: background .2s, opacity .3s;
  width: max-content; min-width: 100%;
}
.peek-row:last-child { border-bottom: none; }
.peek-no {
  flex-shrink: 0; width: 22px; display: flex; align-items: center; justify-content: center;
  color: var(--faint); background: var(--ground); font-size: 10px;
  border-right: 1px solid var(--line-soft);
  position: sticky; left: 0; z-index: 1;   /* 横へ流れても行番号は残す */
}
.peek-cells { display: flex; }
.peek-c {
  flex: 0 0 88px; padding: 6px 7px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px dotted var(--line);
}
.peek-c:last-child { border-right: none; }
/* 1行目＝いま判断している行。ここが見えていないと質問が宙に浮く */
.peek-row.first { background: var(--primary-weak); }
.peek-row.first .peek-c { font-weight: 800; color: var(--primary-deep); }
.peek-row.rest .peek-c { color: var(--muted); }
/* 選んだ瞬間に、その行がどう扱われるかを見せてから次へ進む */
.peek-row.lift  { animation: peek-lift .5s cubic-bezier(.4,0,.2,1) both; }
.peek-row.stay  { animation: peek-stay .5s cubic-bezier(.4,0,.2,1) both; }
@keyframes peek-lift {
  40%  { transform: translateY(-4px); background: var(--primary-soft); }
  100% { transform: translateY(-16px); opacity: 0; background: var(--primary-soft); }
}
@keyframes peek-stay {
  40%  { transform: translateY(3px); background: var(--ok-weak); }
  100% { transform: none; background: var(--ok-weak); }
}
/* 列をタップして選ぶとき */
.peek.pickable .peek-c { cursor: pointer; }
.peek.pickable .peek-c:active { background: var(--primary-soft); }
.peek.cellpick .peek-c.cell { cursor: pointer; }
.peek.cellpick .peek-c.cell:active { background: var(--primary-soft); }
.peek.cellpick .peek-c.cell:hover { background: var(--primary-weak); }
.peek-head { background: var(--ground); position: sticky; top: 0; z-index: 2; }
.peek-head .peek-c {
  font-size: 10px; font-weight: 800; color: var(--muted); padding: 5px 7px;
  border-bottom: 1px solid var(--line-soft);
}
.peek-col.hot .peek-c { background: var(--primary-soft); }

.peek-cap { display: flex; align-items: center; }
.peek-hint {
  margin-left: auto; font-size: 9.5px; font-weight: 800; color: var(--faint);
  letter-spacing: 0; text-transform: none;
}
.peek-hint.moving { color: var(--primary); }
.peek-cn {
  display: inline-block; background: var(--line); color: var(--muted);
  border-radius: 3px; padding: 0 3px; margin-right: 4px; font-size: 9px;
}
.peek.rowpick .peek-row.pick { cursor: pointer; }
.peek.rowpick .peek-row.pick:active { background: var(--primary-soft); }
.peek-row.guess { background: var(--amber-bg); box-shadow: inset 3px 0 0 var(--amber-line); }
.peek-tag {
  flex-shrink: 0; align-self: center; margin: 0 6px 0 4px; position: sticky; right: 4px;
  font-size: 9.5px; font-weight: 800; color: var(--amber-ink);
  background: #fff; border: 1px solid var(--amber-line); border-radius: 5px; padding: 1px 5px;
}
.peek-row.chosen { background: var(--primary-soft) !important; }
.peek-c.chosen { background: var(--primary) !important; color: #fff !important; font-weight: 800; }
.peek-row.chosen .peek-c { font-weight: 800; color: var(--primary-deep); }

/* 1ページに2ページ分入っている紙。左右に同じ形の表が並ぶことが見えれば足りる */
.sec-page { padding: 8px 9px 10px; background: #fff; }
.sec-meta { font-size: 8.5px; color: var(--faint); margin-bottom: 5px; }
.sec-cols { display: flex; align-items: flex-start; }
.sec-gap { width: 14px; flex-shrink: 0; }
.sec-tbl { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.sec-row { display: flex; font-size: 8px; border-bottom: 1px solid var(--line-soft); }
.sec-row:last-child { border-bottom: none; }
.sec-row.head { background: var(--ground); font-weight: 800; color: var(--muted); }
.sec-c {
  min-width: 0; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px dotted var(--line);
}
.sec-c:last-child { border-right: none; }

.ask-opts { display: flex; flex-direction: column; gap: 9px; }
/* 段数：検出した数を既定にして、1〜4から選び直せる */
.secpick { display: flex; gap: 8px; }
.secbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 11px 6px 9px; cursor: pointer;
  font-family: var(--font); -webkit-tap-highlight-color: transparent;
}
.secbtn.det { border-color: var(--primary); background: var(--primary-weak); }
.secbtn-n { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1; }
.secbtn.det .secbtn-n { color: var(--primary); }
.secbtn-c { font-size: 10.5px; color: var(--muted); font-weight: 700; }
.secbtn-tag {
  font-size: 8.5px; font-weight: 800; color: #fff; background: var(--primary);
  border-radius: 4px; padding: 1px 4px;
}
/* 主導線ではないが、押せることは一目で分かる必要がある。
   枠と面を与え、指で押せる高さ（44px）を確保する。 */
.ask-back {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; min-height: 44px; margin-top: 12px;
  border: 1.5px solid var(--primary-border); background: var(--primary-weak);
  color: var(--primary); font-family: var(--font); font-size: 13px; font-weight: 800;
  border-radius: 11px; padding: 11px 14px; cursor: pointer; text-align: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s, background .15s;
}
.ask-back:active { transform: scale(.985); background: var(--primary-soft); }
.ask-back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ask-back::before { content: '↺'; font-size: 14px; font-weight: 700; opacity: .8; }
/* 「見出しの行はありません」は戻る操作ではないので、記号を変える */
#askNoHead::before { content: '✕'; font-size: 12px; }

/* ── ② 読み取りの要約。1行で、直す入口も兼ねる ── */
.crumb {
  flex-shrink: 0; width: 100%; display: flex; align-items: center; gap: 8px;
  border: none; border-bottom: 1px solid var(--line); background: var(--surface);
  padding: 9px 14px; cursor: pointer; text-align: left;
  font-family: var(--font); font-size: 12px; color: var(--muted);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap; overflow: hidden;
}
.crumb:active { background: var(--ground); }
.crumb-main { color: var(--ink); font-weight: 700; }
.crumb-warn { color: var(--danger); font-weight: 800; }
.crumb-go { margin-left: auto; color: var(--primary); font-weight: 800; white-space: nowrap; }

/* ── ③ マッピング面。操作の主役なので全画面を渡す ── */
.map { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.map-foot {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line-soft);
}
.map-head {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--font); font-size: 11px; font-weight: 700;
  border-radius: 8px; padding: 5px 9px; cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.map-hint { font-size: 11px; color: var(--faint); }
/* ── マッピング面：元データの上に対応を色で書く ── */
.map-cap {
  flex-shrink: 0; display: flex; align-items: baseline; gap: 8px;
  padding: 10px 14px 6px;
}
.map-cap-t { font-size: 12.5px; font-weight: 800; color: var(--ink); }
.map-cap-s { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 700; }
.peek.map {
  flex: 1 1 auto; min-height: 120px; margin: 0 12px; border-radius: 11px;
  border: 1px solid var(--line); overflow: hidden; background: var(--surface);
  display: flex; flex-direction: column;
}
.peek.map .peek-body { flex: 1; min-height: 0; max-height: none; }
.peek-row.mhead { border-bottom: 1px solid var(--line); }
.peek-c.mc { cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* 割り当て済みの列は、見出しからデータまで縦に色が通る。どの列がどの項目かが、
   元データを見ながら分かる。 */
.peek-c.mc.mapped { background: var(--fw); box-shadow: inset 2px 0 0 var(--fc); }
.peek-c.mc.picking { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--primary); }
.peek-row.mhead .peek-c.mc {
  display: flex; flex-direction: column; gap: 1px; padding: 6px 7px 5px; align-items: flex-start;
}
.mc-no { font-size: 9px; font-weight: 800; color: var(--faint); }
.mc-src { font-size: 11px; font-weight: 700; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.mc-f { font-size: 9.5px; font-weight: 800; color: var(--fc); }
.mc-none { color: var(--faint); font-weight: 700; }

/* 列をタップしたら、その場で項目を選ぶ */
.fbar {
  flex-shrink: 0; margin: 8px 12px 0; padding: 9px 11px 10px;
  background: var(--primary-weak); border: 1.5px solid var(--primary-border); border-radius: 11px;
}
.fbar[hidden] { display: none !important; }
.fbar-t { font-size: 12px; font-weight: 800; color: var(--primary-deep); margin-bottom: 7px; }
.fbar-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fchip {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--font); font-size: 11.5px; font-weight: 700;
  border-radius: 8px; padding: 5px 9px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fchip.on { background: var(--fc); border-color: var(--fc); color: #fff; }
.fchip.none { color: var(--muted); }
.fchip .req { color: var(--danger); font-weight: 800; margin-left: 2px; }
.fchip.on .req { color: #fff; }

/* まだ決まっていない項目 */
.todo {
  flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 10px 14px 4px;
}
.todo-t { font-size: 11px; font-weight: 800; color: var(--faint); }
.todo-ok { font-size: 12px; font-weight: 800; color: var(--ok); }
.tchip {
  border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--font); font-size: 11.5px; font-weight: 700;
  border-radius: 8px; padding: 4px 9px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tchip.req { border-color: var(--danger-line); background: var(--danger-weak); color: var(--danger); }
.tchip.waiting { border-style: solid; border-color: var(--primary); background: var(--primary-weak); color: var(--primary); }

/* 何と何を対応させているのかを、画面に書いておく */
.zone-h {
  flex-shrink: 0; display: flex; align-items: center; gap: 7px;
  padding: 9px 14px 5px;
}
.zone-n {
  width: 17px; height: 17px; border-radius: 50%; background: var(--primary);
  color: #fff; font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.zone-t { font-size: 12px; font-weight: 800; color: var(--ink); }
.zone-s { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 700; }
.zone-arrow {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 0; font-size: 10.5px; color: var(--faint); font-weight: 700;
}
.zone-arrow::before, .zone-arrow::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}
.map-warn { color: var(--danger); font-weight: 800; }

/* ── ④ 全画面プレビュー。フワッと出て、組み上がって、消える ── */
.pv {
  position: absolute; inset: 0; z-index: 70;
  background: rgba(15,23,42,.34);
  display: flex; align-items: stretch; padding: 10px;
}
.pv[hidden] { display: none !important; }
.pv-card {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--ground); border-radius: 16px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(15,23,42,.30);
}
/* フワッと：わずかに縮んだ状態から等倍へ。動きは小さく、時間で見せる */
@keyframes pv-in  { from { opacity: 0; transform: scale(.965) translateY(8px) } to { opacity: 1; transform: none } }
@keyframes pv-out { from { opacity: 1; transform: none } to { opacity: 0; transform: scale(.985) translateY(4px) } }
.pv.in  { animation: pv-fade-in .22s ease-out both; }
.pv.out { animation: pv-fade-out .26s ease-in both; }
@keyframes pv-fade-in  { from { opacity: 0 } to { opacity: 1 } }
@keyframes pv-fade-out { from { opacity: 1 } to { opacity: 0 } }
.pv.in  .pv-card { animation: pv-in .30s cubic-bezier(.22,.61,.36,1) both; }
.pv.out .pv-card { animation: pv-out .26s ease-in both; }
.pv-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.pv-t { font-size: 12.5px; font-weight: 800; color: var(--ink); }
.pv-x {
  margin-left: auto; border: none; background: var(--primary); color: #fff;
  font-size: 12.5px; font-weight: 800; border-radius: 9px; padding: 7px 14px; cursor: pointer;
}
.pv-foot {
  flex-shrink: 0; padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.pv-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* 並び替えタブ。居座るプレビューでは実際に効く */
.sorts { flex-shrink: 0; display: flex; gap: 6px; padding: 8px 12px 4px; overflow-x: auto; scrollbar-width: none; }
.sorts::-webkit-scrollbar { display: none; }
.seg {
  flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 11.5px; font-weight: 700; border-radius: 8px; padding: 5px 10px; cursor: pointer;
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.seg.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.sorts.locked .seg { pointer-events: none; opacity: .85; }

.pvbtn {
  flex-shrink: 0; border: 1.5px solid var(--primary-border); background: var(--primary-weak);
  color: var(--primary); font-size: 12px; font-weight: 800;
  border-radius: 10px; padding: 9px 10px; cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

/* ── 入力源：列チップ ─────────────────────────────────────── */
.src { flex-shrink: 0; background: var(--surface); position: relative; }
.chips {
  display: flex; gap: 8px; padding: 9px 12px 11px;
  overflow-x: auto; overflow-y: hidden;
  /* 横だけ引き取る。宣言しないと Android Chrome が「進む・戻る」のエッジ操作として
     処理して履歴を横取りする（振り分けで実際に起きた） */
  touch-action: pan-x;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0; width: 96px;
  border: 1.5px solid var(--line); border-radius: 11px;
  background: var(--surface); padding: 6px 8px 7px;
  cursor: grab; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;   /* チップ自体はドラッグを引き取る */
  position: relative;
  transition: transform .18s cubic-bezier(.22,.61,.36,1), box-shadow .18s, border-color .15s, opacity .18s;
}
.chip-head {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 800; color: var(--faint);
  margin-bottom: 4px;
}
.chip-no {
  background: var(--ground); border-radius: 4px; padding: 0 4px;
  color: var(--muted); flex-shrink: 0;
}
.chip-title {
  font-size: 11.5px; font-weight: 800; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.chip-vals { display: flex; flex-direction: column; gap: 1px; }
.chip-val {
  font-size: 10.5px; color: var(--muted); line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 割り当て済み：上辺にフィールド色の帯。どの列がどこへ行ったかを一目で戻せる */
.chip.used { border-color: var(--fc); background: #fff; }
.chip.used::before {
  content: ''; position: absolute; left: -1.5px; right: -1.5px; top: -1.5px; height: 4px;
  background: var(--fc); border-radius: 11px 11px 0 0;
}
.chip-badge {
  display: inline-block; font-size: 9.5px; font-weight: 800; color: #fff;
  background: var(--fc); border-radius: 4px; padding: 1px 5px; margin-top: 4px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 使わなかった列も灰色で残す。いまは (使用しない) が select の中に隠れていて
   「捨てた情報」が見えない */
.chip.idle { opacity: .72; }
.chip.await { border-color: var(--primary-mid); }
.chip.picked {
  border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak);
  transform: translateY(-3px);
}
.chip.dragging { opacity: .35; }
.chip.empty-col { opacity: .45; }
.chip-empty-tag { font-size: 10px; color: var(--faint); }

/* 指に付いてくる分身 */
.ghost {
  position: fixed; z-index: 90; pointer-events: none;
  width: 96px; border: 1.5px solid var(--primary); border-radius: 11px;
  background: var(--surface); padding: 6px 8px 7px;
  box-shadow: 0 10px 24px rgba(15,23,42,.22);
  transform-origin: 50% 50%;
}

/* ── 入力源：PDFのページ ───────────────────────────────────── */
.pdf {
  position: relative; background: #fff; overflow: auto;
  height: 40%; min-height: 150px; touch-action: pan-x pan-y;
  border-bottom: 1px solid var(--line-soft);
}
.pdf-page {
  position: relative; width: 460px; height: 300px; margin: 8px auto;
  background: #fff; box-shadow: 0 0 0 1px var(--line);
  transform-origin: 0 0;
}
.tok {
  position: absolute; font-size: 9px; color: #334155; white-space: nowrap;
  padding: 1px 2px; border-radius: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tok.head { font-weight: 800; color: #0f172a; }
.tok.incol { box-shadow: inset 0 -2px 0 var(--fc); }
.tok.hot { background: var(--fc); color: #fff; box-shadow: none; }
.pdf-hint {
  position: sticky; top: 0; z-index: 2;
  font-size: 11px; color: var(--muted); background: rgba(255,255,255,.94);
  padding: 5px 12px; border-bottom: 1px solid var(--line-soft);
}

/* ── 組み上がる結果 ───────────────────────────────────────── */
.out { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 0; touch-action: pan-y; }
.tablewrap { padding: 0 12px; }

/* 実物の棚卸カードと同じ形にする。ここが違うと「取り込んだ後どう見えるか」の
   判断材料にならない（InventoryTable.vue の .inv-table を写している） */
.inv {
  width: 100%; border-collapse: collapse; background: var(--surface);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  table-layout: fixed;
}
.inv thead tr { background: var(--primary-deep); color: #fff; }
.inv th {
  padding: 9px 12px; text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
}
.inv th.qty, .inv th.amount { text-align: center; }
.inv th.code { padding-left: 8px; padding-right: 4px; }
.inv tbody tr { border-bottom: 1px solid var(--line-soft); }
.inv tbody tr:last-child { border-bottom: none; }
.td-code { padding: 9px 4px 9px 8px; font-size: 10px; font-family: monospace; color: var(--muted); white-space: nowrap; }
.td-name { padding: 8px 12px; font-size: 13px; line-height: 1.4; }
.nm { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.hint { font-size: 10.5px; color: var(--muted); }
.hint.lot { color: #7c3aed; }
.td-qty { padding: 6px 8px; text-align: center; white-space: nowrap; }
.qtybox {
  display: inline-flex; align-items: baseline; gap: 2px; min-width: 48px;
  border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 7px;
  font-size: 15px; font-weight: 700; color: var(--muted); background: var(--ground);
  justify-content: center;
}
.td-amount { padding: 8px 10px; text-align: center; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* 行の状態。新規・更新・変更なし・取り込めない、を左の帯で示す */
.inv tbody tr.st-add    { box-shadow: inset 3px 0 0 var(--ok); }
.inv tbody tr.st-upd    { box-shadow: inset 3px 0 0 var(--primary); }
.inv tbody tr.st-same   { box-shadow: inset 3px 0 0 var(--line); }
.inv tbody tr.st-err    { background: var(--danger-weak); box-shadow: inset 3px 0 0 var(--danger); }
.rowtag {
  font-size: 9.5px; font-weight: 800; border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
}
.rowtag.add  { background: var(--ok-weak); color: var(--ok); }
.rowtag.upd  { background: var(--primary-weak); color: var(--primary); }
.rowtag.same { background: var(--ground); color: var(--faint); }
.rowtag.err  { background: #fee2e2; color: var(--danger); }
.errmsg { font-size: 11px; color: var(--danger); margin-top: 2px; }
/* 更新は変わる値だけ見せる。差分リストを読ませない */
/* 更新は「何が何に変わるか」を縦に積む。横に並べると幅に入らない */
.money { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25; }
.was { color: var(--faint); text-decoration: line-through; font-size: 10px; }
/* 読めなかったので空にした欄。何が書いてあったかを必ず添える */
.blanked {
  font-size: 10px; font-weight: 800; color: var(--amber-ink);
  background: var(--amber-bg); border: 1px solid var(--amber-line);
  border-radius: 4px; padding: 0 4px;
}
.blanked-raw { font-size: 9px; color: var(--faint); margin-top: 1px; }
.rowtag.blank { background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-line); }
.inv tbody tr.has-blank { box-shadow: inset 3px 0 0 var(--amber-line); }
.n-blank {
  border: none; background: var(--amber-bg); color: var(--amber-ink);
  border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 800; cursor: pointer;
}
.now { font-weight: 700; color: var(--ink); }

/* ジャンル別の見出し。分類列を割り当てた瞬間にこれが生える */
.grp {
  background: var(--ground); font-size: 11.5px; font-weight: 800; color: #475569;
}
.grp td { padding: 7px 12px; }
.grp .arrow { color: var(--faint); font-size: 10px; margin-right: 6px; }
.grp .cnt { color: var(--faint); font-weight: 700; float: right; }


/* ── 見本カード（1件目）──────────────────────────────────────
   「見本」と「結果」を同じものにする。覚えることが「点線に列を落とす」の
   ひとつだけになり、2件目以降がそのまま答え合わせになる。 */
.sample {
  flex: 1; min-height: 0; overflow-y: auto;
  margin: 4px 12px 8px; padding: 12px 14px 13px;
  background: var(--surface); border: 1.5px solid var(--primary-border);
  border-radius: 14px;
}
.sample-lead {
  font-size: 10px; font-weight: 800; color: var(--primary);
  letter-spacing: .06em; margin-bottom: 7px;
}
.slot-name { margin-bottom: 8px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }

.slot {
  border: 1.5px dashed var(--line); border-radius: 9px;
  background: var(--ground); padding: 5px 9px; cursor: pointer;
  font-size: 11.5px; color: var(--faint); font-weight: 700;
  -webkit-tap-highlight-color: transparent; user-select: none;
  transition: transform .16s cubic-bezier(.22,.61,.36,1), border-color .16s, background .16s, box-shadow .16s;
  display: inline-flex; align-items: center; gap: 5px; min-height: 30px;
}
.slot.big { width: 100%; padding: 8px 11px; font-size: 15px; min-height: 42px; }
.slot-lab { font-size: 9.5px; font-weight: 800; color: var(--fc); flex-shrink: 0; }
.slot-val { color: var(--ink); font-weight: 700; }
.slot.big .slot-val { font-size: 16px; font-weight: 800; }
.slot.filled { border-style: solid; border-color: var(--fc); background: #fff; color: var(--ink); }
.slot-cur { color: var(--faint); font-weight: 700; font-size: 10.5px; }
.slot.req.empty { border-color: var(--danger-line); background: var(--danger-weak); color: var(--danger); }
/* 置ける場所を光らせる（掴んだときだけ） */
.slot.armed { border-color: var(--primary); background: var(--primary-weak); color: var(--primary); }
.slot.over  { border-color: var(--primary); background: var(--primary-soft); transform: scale(1.06); box-shadow: 0 0 0 4px var(--primary-weak); }
.slot-x {
  border: none; background: none; color: var(--faint); font-size: 12px;
  padding: 0 0 0 2px; cursor: pointer; line-height: 1;
}
/* 必須が空のあいだ、そこだけ脈打つ。最初の1手を迷わせない */
@keyframes pulse-req {
  0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  50%      { box-shadow: 0 0 0 5px rgba(220,38,38,.16); }
}
.slot.req.empty.hint-pulse { animation: pulse-req 1.7s ease-in-out infinite; }

/* ── 値が湧き上がる（控えめ〜標準）────────────────────────── */
@keyframes rise {
  from { opacity: 0; transform: translateY(var(--rise, 9px)); }
  to   { opacity: 1; transform: none; }
}
.rise { animation: rise var(--rise-ms, 300ms) cubic-bezier(.22,.61,.36,1) both; }
@keyframes bump {
  0% { background: var(--primary-weak); }
  100% { background: transparent; }
}
.bump { animation: bump 520ms ease-out; }
@keyframes colgrow {
  from { opacity: 0; transform: translateX(10px); }
  to   { opacity: 1; transform: none; }
}
.colgrow { animation: colgrow 320ms cubic-bezier(.22,.61,.36,1) both; }

/* ── 組み立て（強め）──────────────────────────────────────────
   「浮かび上がる」ではなく「部品が飛んできて、位置で噛み合って止まる」。
   噛み合いは overshoot → 行き過ぎ → 戻る の3段で作る。1段だと弾んだだけに見え、
   機械が嵌まった感じにならない。 */
@keyframes asm-cell {
  0%   { opacity: 0; transform: perspective(460px) rotateY(-54deg) translateX(22px) scale(.9); }
  55%  { opacity: 1; transform: perspective(460px) rotateY(7deg)  translateX(-3px) scale(1.02); }
  78%  { opacity: 1; transform: perspective(460px) rotateY(-2.5deg) translateX(1px) scale(.995); }
  100% { opacity: 1; transform: none; }
}
.asm {
  animation: asm-cell var(--asm-ms, 460ms) cubic-bezier(.2,.7,.3,1) both;
  transform-origin: right center;
  display: inline-block;   /* transform を効かせるため。ただし自前の並びを持つ物は下で戻す */
}
/* 旧価格→新価格の縦積みと、振り分けチップの折り返しは自分の display を持っている。
   まとめて inline-block にすると、動いている間だけ並びが壊れる。 */
.money.asm { display: inline-flex; }
.pg.asm { display: flex; }
/* 列の見出しは上から降りてきて蓋をする */
@keyframes asm-th {
  0%   { opacity: 0; transform: perspective(560px) rotateX(-78deg) translateY(-12px); }
  58%  { opacity: 1; transform: perspective(560px) rotateX(10deg) translateY(3px); }
  80%  { transform: perspective(560px) rotateX(-3deg) translateY(-1px); }
  100% { opacity: 1; transform: none; }
}
.asm-th { animation: asm-th 480ms cubic-bezier(.2,.7,.3,1) both; transform-origin: top center; }

/* 噛み合った瞬間、その列の縁が一度光る */
@keyframes asm-lock {
  0%   { box-shadow: inset 0 0 0 0 rgba(37,99,235,0); }
  30%  { box-shadow: inset 0 0 0 2px rgba(37,99,235,.5); }
  100% { box-shadow: inset 0 0 0 0 rgba(37,99,235,0); }
}
.asm-lock { animation: asm-lock 620ms ease-out both; }

/* 最後に、組み上がった全体を一度なぞる光 */
@keyframes asm-sweep {
  from { transform: translateX(-40%); opacity: 0; }
  25%  { opacity: 1; }
  to   { transform: translateX(240%); opacity: 0; }
}
.pend { opacity: 0 !important; }
.asm-sweep {
  position: absolute; inset: 0 auto 0 0; width: 42%; pointer-events: none; z-index: 4;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.62), transparent);
  animation: asm-sweep 700ms cubic-bezier(.4,0,.5,1) both;
}

/* チップがスロットへ飛ぶ */
.fly {
  position: fixed; z-index: 95; pointer-events: none;
  border-radius: 10px; background: var(--fc); color: #fff;
  font-size: 11px; font-weight: 800; padding: 5px 9px;
  box-shadow: 0 8px 20px rgba(15,23,42,.25);
}

/* ── 下部サマリーバー ─────────────────────────────────────── */
.foot {
  flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 10px;
}
.foot-nums { flex: 1; min-width: 0; }
.foot-line1 { font-size: 12.5px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.foot-line2 { font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; }
.num { font-variant-numeric: tabular-nums; }
.n-add  { color: var(--ok); }
.n-upd  { color: var(--primary); }
.n-same { color: var(--faint); }
.n-err  { color: var(--danger); font-weight: 800; }
.foot-err {
  border: none; background: var(--danger-weak); color: var(--danger);
  font-size: 11px; font-weight: 800; border-radius: 7px; padding: 4px 8px; cursor: pointer;
}
.go {
  flex-shrink: 0; border: none; border-radius: 10px;
  background: var(--primary); color: #fff; font-size: 13px; font-weight: 800;
  padding: 10px 13px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.go:disabled { background: #cbd5e1; }

/* ── 取込方法（追加更新 / 全入れ替え）── */
.modebar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--line-soft);
  font-size: 11px; color: var(--muted);
}
.modeseg { display: flex; background: var(--ground); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.modeseg button {
  border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 700;
  padding: 4px 9px; border-radius: 7px; cursor: pointer; white-space: nowrap;
}
.modeseg button.on { background: var(--primary); color: #fff; }
.modeseg button.on.danger { background: var(--danger); }

/* ── 確認シート（片方の案）── */
.mask {
  position: absolute; inset: 0; z-index: 60; background: rgba(15,23,42,.42);
  display: flex; align-items: flex-end;
}
.sheet {
  width: 100%; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 86%; overflow-y: auto;
  animation: sheet-up .26s cubic-bezier(.22,.61,.36,1);
}
@keyframes sheet-up { from { transform: translateY(14%); opacity: .6 } to { transform: none; opacity: 1 } }
.sheet-h { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.kpis { display: flex; gap: 8px; margin-bottom: 12px; }
.kpi { flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 8px; text-align: center; }
.kpi-n { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi-l { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.sheet-block { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; margin-bottom: 10px; }
.sheet-block.warn { border-color: var(--amber-line); background: var(--amber-bg); }
.sheet-block-t { font-size: 12px; font-weight: 800; margin-bottom: 5px; }
.sheet-block-b { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.sheet-acts { display: flex; gap: 10px; margin-top: 4px; }
.sheet-acts button { flex: 1; border-radius: 11px; padding: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn-cancel { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.btn-ok { border: none; background: var(--primary); color: #fff; }
.btn-ok.danger { background: var(--danger); }
.chk { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.5; cursor: pointer; }
.chk input { width: 17px; height: 17px; margin-top: 1px; flex-shrink: 0; }

/* ── レシピ（保存した読み方）─────────────────────────────
   同じ帳票は毎月同じ形で来る。2回目からは問いをぜんぶ飛ばして
   「この読み方で読みました」だけを見せ、違うときにその場で外せるようにする。
   帯は結果の宣言であって操作ではないので、高さは1行に収める。 */
.rcp {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--primary-soft);
  border-bottom: 1px solid var(--primary-border);
  animation: rcp-in .3s cubic-bezier(.22,.61,.36,1);
}
@keyframes rcp-in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
.rcp-t {
  flex: 1; min-width: 0; font-size: 12px; font-weight: 800; color: var(--primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rcp-t .rcp-n { font-variant-numeric: tabular-nums; }
.rcp-off {
  flex-shrink: 0; border: 1px solid var(--primary-border); background: var(--surface);
  color: var(--primary); font-size: 11px; font-weight: 800; border-radius: 7px;
  padding: 5px 9px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.rcp-off:active { transform: scale(.97); }

/* 取り込んだ後の1枚。ここで初めて「保存しますか」を訊く ──
   合っていたと分かってからでないと、名前を付ける意味が無い。 */
.done-card {
  position: absolute; left: 12px; right: 12px; bottom: 76px; z-index: 55;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 14px; box-shadow: 0 12px 34px rgba(15,23,42,.22);
}
.done-t { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
.done-b { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.done-acts { display: flex; gap: 8px; margin-top: 11px; }
.done-acts button { flex: 1; border-radius: 10px; padding: 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
.done-save { border: none; background: var(--primary); color: #fff; }
.done-skip { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.done-saved { border: 1px solid var(--primary-border); background: var(--primary-soft); color: var(--primary); }

/* 名前を付ける。既定はファイル名から作る（毎月同じ名前で来るので、たいてい当たる） */
.rcp-name {
  width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 11px;
  padding: 12px 13px; font-size: 15px; font-weight: 700; color: var(--ink);
  background: var(--surface); margin-bottom: 10px;
}
.rcp-name:focus { outline: none; border-color: var(--primary); }
.rcp-what { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.rcp-what .wchip {
  font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 3px 7px;
  background: var(--fw, var(--primary-weak)); color: var(--fc, var(--primary));
  border: 1px solid currentColor;
}
/* 保存済みの一覧。名前と、どの形の紙に効くかだけ出す */
.rcp-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.rcp-row {
  display: flex; align-items: center; gap: 9px;
  border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px;
}
.rcp-row.hit { border-color: var(--primary); background: var(--primary-soft); }
.rcp-row-b { flex: 1; min-width: 0; }
.rcp-row-t { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcp-row-s { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.rcp-del {
  border: 1px solid var(--line); background: var(--surface); color: var(--danger);
  font-size: 11px; font-weight: 800; border-radius: 7px; padding: 6px 9px; cursor: pointer;
}
.rcp-use {
  border: none; background: var(--primary); color: #fff;
  font-size: 11px; font-weight: 800; border-radius: 7px; padding: 7px 11px; cursor: pointer;
}
.rcp-empty { font-size: 12px; color: var(--faint); line-height: 1.7; padding: 6px 0 12px; }

/* 振り分けセル。実物（InventoryTable の .preview-group-chip）と同じ、
   チップが折り返す形。1つの箱に詰めると2軸で必ず溢れる。 */
.pg { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.pgchip {
  font-size: 9.5px; background: var(--primary-weak); color: var(--primary);
  border: 1px solid var(--primary-border); border-radius: 5px; padding: 1px 5px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pgnone { font-size: 10.5px; color: var(--faint); }
.grp.ng { background: var(--danger-weak); color: var(--danger); }
.inv tbody tr.st-meta { background: var(--amber-bg); box-shadow: inset 3px 0 0 var(--amber-line); }
.rowtag.meta { background: #fff; color: var(--amber-ink); border: 1px solid var(--amber-line); }
.keepmeta {
  float: right; margin-right: 8px; border: 1px solid var(--amber-line); background: #fff;
  color: var(--amber-ink); font-size: 10px; font-weight: 800; border-radius: 6px;
  padding: 2px 7px; cursor: pointer;
}
.grp.ng .arrow, .grp.ng .cnt { color: var(--danger); }

/* 全部埋まったときの1行。置き場は消えて一覧が画面いっぱいになる */
.sample.done {
  padding: 7px 12px; border-style: solid; border-color: var(--line);
  background: var(--surface); box-shadow: none;
}
.done-line { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.done-ok { color: var(--ok); font-weight: 800; }
.done-hint { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 700; white-space: nowrap; }
.pairs { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.pair {
  display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
  border: 1px solid var(--line); border-left: 3px solid var(--fc);
  background: var(--surface); border-radius: 9px; padding: 7px 9px; cursor: pointer;
  font-family: var(--font); -webkit-tap-highlight-color: transparent;
}
.pair:active { background: var(--ground); }
.pair.waiting { border-color: var(--primary); background: var(--primary-weak); box-shadow: 0 0 0 3px var(--primary-weak); }
.pairs-hint b { color: var(--primary); }
.pair-f { font-size: 11.5px; font-weight: 800; color: var(--fc); width: 74px; flex-shrink: 0; }
.pair-arrow { color: var(--faint); font-size: 10px; flex-shrink: 0; }
.pair-c { font-size: 11.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pair-no { background: var(--ground); border-radius: 4px; padding: 0 4px; margin-right: 4px; color: var(--muted); font-size: 9.5px; }
.pair-v { margin-left: auto; font-size: 10.5px; color: var(--faint); white-space: nowrap; flex-shrink: 0; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
.pairs-hint { font-size: 10.5px; color: var(--faint); margin-top: 8px; }
.done-rest { color: var(--faint); font-weight: 700; }
.sample.picking { border-color: var(--primary); box-shadow: 0 6px 20px rgba(37,99,235,.16); }
.sample.picking .sample-lead { color: var(--primary); }

/* チップの割当バッジに付く「外す」 */
.chip-x {
  border: none; background: none; color: rgba(255,255,255,.85);
  font-size: 9px; padding: 0 0 0 4px; cursor: pointer; line-height: 1;
}

/* 取込方法。常設の帯を置かず、件数の隣から開く */
.modelink {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 10.5px; font-weight: 800; border-radius: 7px; padding: 2px 6px;
  margin-left: 8px; cursor: pointer; vertical-align: 1px;
}
.modelink.danger { border-color: var(--danger-line); color: var(--danger); background: var(--danger-weak); }
.modeopt {
  border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
}
.modeopt-t { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
.modeopt-b { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
.foot-line2 .sep { color: var(--line); margin: 0 5px; }
.errjump {
  border: none; background: var(--danger-weak); border-radius: 6px;
  padding: 1px 6px; font-size: 11px; cursor: pointer;
}
.go.danger { background: var(--danger); }

/* ── 計測・切替パネル ─────────────────────────────────────── */
.probe {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 80;
  background: rgba(255,255,255,.975); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 12px 12px;
  box-shadow: 0 10px 30px rgba(15,23,42,.18);
  font-size: 11.5px; max-height: 76%; overflow-y: auto;
}
.probe.hide { display: none; }
.probe-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.probe-t { font-weight: 800; font-size: 12px; flex: 1; }
.probe-x { border: none; background: var(--ground); border-radius: 7px; width: 26px; height: 26px; cursor: pointer; }
.prow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.plab { width: 74px; flex-shrink: 0; color: var(--muted); font-weight: 700; }
.pbtns { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.pbtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.pbtn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.pbtn:disabled { cursor: default; }
.pnote { align-self: center; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.pnums {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; padding-top: 8px;
  border-top: 1px dashed var(--line); color: var(--muted);
}
.pnums b { color: var(--ink); font-variant-numeric: tabular-nums; }
.prange { flex: 1; }

/* 動きを減らす設定。並べ替えと違い、ここでの演出は情報ではなく装飾なので全部止めてよい。
   ただし「値が入った」ことは分かる必要があるので、色の変化だけ残す。 */
@media (prefers-reduced-motion: reduce) {
  .rise, .bump, .colgrow, .sheet { animation: none !important; }
  .slot, .chip { transition: none !important; }
}
.reduced .rise, .reduced .bump, .reduced .colgrow { animation: none !important; }
.reduced .slot, .reduced .chip { transition: none !important; }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="hd">
    <button class="hd-back">‹ 戻る</button>
    <div class="hd-file">
      <div class="hd-name" id="fname">仕入先リスト.csv</div>
      <div class="hd-sub" id="fsub">312行</div>
    </div>
    <button class="hd-gear" id="gear" aria-label="計測パネル">⚙</button>
  </header>

  <!-- レシピが当たったときだけ出る1行。問いを全部飛ばした事実を、飛ばした場所に書く。
       黙って埋まっていると「なぜ埋まっているのか」が分からず、合っているかも確かめられない。 -->
  <div class="rcp" id="rcp" hidden>
    <span class="rcp-t" id="rcpT"></span>
    <button class="rcp-off" id="rcpOff">使わない</button>
  </div>

  <!-- ① 最初に訊くのは1つだけ。選択肢そのものに結果を書いておく。
       「1行目を消してしまう」という事故は、言葉の警告より結果の数字で伝わる。 -->
  <div class="ask" id="ask">
    <div class="ask-q" id="askQ"></div>
    <div class="ask-sub" id="askSub"></div>
    <!-- 訊く相手（ファイルの実物）を必ず一緒に出す。数字だけ見せて選ばせると、
         ユーザーは自分のファイルを見ないまま答えることになる。 -->
    <div class="peek" id="peek"></div>
    <div class="ask-opts" id="askOpts"></div>
    <div class="ask-note" id="askNote"></div>
  </div>

  <!-- ③ マッピング面。ここが操作の主役なので全画面を渡す。
       表を常設すると操作面が画面の半分以下に押し込まれる。 -->
  <div class="map" id="map" hidden>
    <!-- 前の画面で見ていた元データを、そのまま出し続ける。
         列チップは元データの列を作り直したものでしかないので、元データが
         出ているなら要らない。対応はその上に色で書く。 -->
    <div class="map-cap">
      <span class="map-cap-t" id="mapCapT">どの列が何かを決めます</span>
      <span class="map-cap-s" id="unusedn"></span>
    </div>
    <div class="peek map" id="mapPeek"></div>

    <!-- 列をタップしたとき、その場で項目を選ぶ -->
    <div class="fbar" id="fbar" hidden></div>

    <!-- まだ決まっていない項目 -->
    <div class="todo" id="todo"></div>

    <div class="pdf" id="srcPdf" hidden>
      <div class="pdf-hint" id="pdfHint">読みたい数字をタップすると、その列がまるごと入ります</div>
      <div class="pdf-page" id="pdfPage"></div>
    </div>

    <div class="map-foot">
      <button class="map-head" id="msheetHead"></button>
      <span class="map-hint" id="msheetT"></span>
    </div>
  </div>

  <!-- ④ 全画面プレビュー。項目を決めるたびにフワッと出て、組み上がって、消える。
       「プレビュー」から開いたときは居座って、並べ替えや開閉を実際に触れる。 -->
  <div class="pv" id="pv" hidden>
    <div class="pv-card">
      <div class="pv-head">
        <span class="pv-t" id="pvT">取り込んだ後の棚卸カード</span>
        <button class="pv-x" id="pvClose" hidden>閉じる</button>
      </div>
      <div class="sorts" id="sorts"></div>
      <div class="out" id="out"><table class="inv" id="inv"></table></div>
      <div class="pv-foot" id="pvFoot"></div>
    </div>
  </div>

  <!-- 取込方法は毎回変えるものではない（既定＝追加・更新）。常設の帯で高さを取らず、
       件数行の右端に出して、変えたい人だけがシートを開く。 -->
  <div class="foot" id="foot">
    <div class="foot-nums">
      <div class="foot-line1" id="footl1">—</div>
      <div class="foot-line2" id="footl2"></div>
    </div>
    <button class="pvbtn" id="pvOpen">プレビュー</button>
    <button class="go" id="go" disabled>取り込む</button>
  </div>

  <!-- レシピ：名前を付けて保存する／保存したものを見る -->
  <div class="mask" id="rcpMask" hidden>
    <div class="sheet" id="rcpSheet"></div>
  </div>

  <!-- 取込方法 -->
  <div class="mask" id="modeMask" hidden>
    <div class="sheet">
      <div class="sheet-h">取込方法</div>
      <div class="sheet-sub">既定は「追加・更新」。既存の品目は消えません。</div>
      <div class="modeopt" data-m="merge">
        <div class="modeopt-t">追加・更新</div>
        <div class="modeopt-b">ファイルに無い既存品目は<b>残ります</b>。いつもの取込。</div>
      </div>
      <div class="modeopt" data-m="replace">
        <div class="modeopt-t">全入れ替え</div>
        <div class="modeopt-b">ファイルに無い既存品目を<b>削除します</b>。発注点・振り分けも失われます。</div>
      </div>
      <div class="sheet-acts"><button class="btn-cancel" id="modeClose">閉じる</button></div>
    </div>
  </div>

  <!-- 確認シート（案B：従来どおりもう一段挟む） -->
  <div class="mask" id="mask" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- 計測・切替 -->
  <div class="probe hide" id="probe">
    <div class="probe-h">
      <span class="probe-t">試作の切替 / 計測</span>
      <button class="probe-x" id="probeX">✕</button>
    </div>

    <div class="prow">
      <span class="plab">取込元</span>
      <div class="pbtns" id="pSrc">
        <button class="pbtn" data-src="head">CSV 見出しあり</button>
        <button class="pbtn" data-src="nohead">CSV 見出しなし</button>
        <button class="pbtn" data-src="delivery">納品CSV</button>
        <button class="pbtn" data-src="pdf">PDF</button>
        <button class="pbtn" data-src="dirty">汚いCSV</button>
        <button class="pbtn" data-src="pdf2col">2段組みPDF</button>
        <button class="pbtn" data-src="pdf3col">3段組みPDF</button>
        <button class="pbtn" data-src="real">実物の棚卸表</button>
      </div>
    </div>

    <div class="prow">
      <span class="plab">行数</span>
      <div class="pbtns" id="pRows">
        <button class="pbtn" data-rows="120">120</button>
        <button class="pbtn" data-rows="800">800</button>
        <button class="pbtn" data-rows="3000">3000</button>
        <button class="pbtn" data-rows="8000">8000</button>
        <span class="pnote" id="pRowsNote"></span>
      </div>
    </div>

    <div class="prow">
      <span class="plab">演出の強さ</span>
      <div class="pbtns" id="pFx">
        <button class="pbtn" data-fx="0">なし</button>
        <button class="pbtn" data-fx="1">控えめ</button>
        <button class="pbtn" data-fx="2">標準</button>
        <button class="pbtn" data-fx="3">組み立て</button>
      </div>
    </div>

    <div class="prow">
      <span class="plab">湧き上がり</span>
      <input class="prange" id="pStagger" type="range" min="0" max="60" step="2">
      <b id="pStaggerV" style="width:52px;text-align:right"></b>
    </div>

    <div class="prow">
      <span class="plab">組み上がり</span>
      <div class="pbtns" id="pTut">
        <button class="pbtn" data-tut="first">初回だけ</button>
        <button class="pbtn" data-tut="always">毎回</button>
        <button class="pbtn" data-tut="off">出さない</button>
      </div>
    </div>

    <div class="prow">
      <span class="plab">確認</span>
      <div class="pbtns" id="pConfirm">
        <button class="pbtn" data-cf="bar">バーだけ（1画面）</button>
        <button class="pbtn" data-cf="sheet">確認を挟む</button>
      </div>
    </div>

    <div class="prow">
      <span class="plab">操作</span>
      <div class="pbtns" id="pOps">
        <button class="pbtn" id="pRcp">保存したレシピ</button>
        <button class="pbtn" id="pReset">最初から</button>
        <button class="pbtn" id="pAuto">自動検出をやり直す</button>
        <button class="pbtn" id="pClear">全部はずす</button>
      </div>
    </div>

    <div class="pnums">
      <span>再計算 <b id="mPlan">—</b></span>
      <span>描画 <b id="mDraw">—</b></span>
      <span>行 <b id="mRows">—</b></span>
      <span>fps <b id="mFps">—</b></span>
      <span>動き <b id="mMotion">—</b></span>
    </div>
  </div>

</div>

// 行を作る。同じ index なら常に同じ内容（切り替えても比較できるように）
function makeRow(i) {
  const b = BASE[i % BASE.length]
  const gen = Math.floor(i / BASE.length)
  const name = gen === 0 ? b[0] : `${b[0]}${gen === 1 ? '（特上）' : gen === 2 ? '（業務用）' : ' ' + gen}`
  const price = 120 + ((i * 137) % 1800)
  return {
    name,
    category: b[1],
    unit: b[2],
    price: String(price),
    axisA: b[3],
    axisB: b[4],
    code: CODE_HEAD[i % CODE_HEAD.length] + String(100000 + (i * 7919) % 899999),
    lotSize: String(1 + (i % 6)),
    prevMonth: String((i * 13) % 48),
    date: `2026/0${1 + (i % 8)}/${String(1 + (i % 27)).padStart(2, '0')}`,
    qty: String(1 + (i % 24)),
  }
}

// 全角・単位混在・記号つき。業者の帳票では珍しくない書き方
const WIDE = '０１２３４５６７８９'
const toWide = n => String(n).replace(/[0-9]/g, d => WIDE[+d])

// 表の途中に混ざる、品目ではない行
function junkRow(i, cols) {
  const blank = cols.map(() => '')
  if (i % 24 === 8)  return { row: blank.map((_, c) => c === 0 ? `【${['野菜','精肉','鮮魚','酒類'][(i / 24 | 0) % 4]}】` : ''), kind: 'genre' }
  if (i % 24 === 23) return { row: blank.map((_, c) => c === 0 ? '小計' : c === 3 ? String(12000 + i * 7) : ''), kind: 'sum' }
  if (i % 31 === 17) return { row: blank, kind: 'blank' }
  return null
}

// 実運用のCSVはきれいではない。壊れ方も混ぜないと「取り込めない行」の見え方を試せない
function dirty(i, row) {
  if (i > 0 && i % 37 === 0)  return { ...row, name: '' }                    // 品目名が空
  if (i > 0 && i % 53 === 0)  return { ...row, name: makeRow(i - 1).name }   // 直前と重複
  if (i > 0 && i % 71 === 0)  return { ...row, price: '約1280円' }            // 読めない数値
  return row
}

const state = {

  nRows: 800,
  fx: 3,                 // 0 なし / 1 控えめ / 2 標準 / 3 強め
  stagger: 22,           // 湧き上がりの1行あたりの遅れ(ms)

  reveal: null,          // 組み上がりの最中に「ここまで出した」項目。null = 全部
  splitByCode: false,    // 同名・別コードを、名前にコードを付けて別々に登録するか
  keepMeta: false,       // 小計・区分見出しらしい行も品目として取り込むか（既定は外す）
  tutorial: 'first',     // 'first' 初回だけ / 'always' 毎回 / 'off' 出さない
  recipe: null,          // 当たった「保存した読み方」。null = 手で決めている
  picked: null,          // タップ2段で選択中の列
  justFilled: null,      // 直前に埋めたフィールド（湧き上がりの対象）
  grew: {},              // 生えたばかりの列
}
let SRC = null, TABLE = [], EXISTING = new Map(), PLAN = null
let lastPlanMs = 0, lastDrawMs = 0

const fields = () => SRC.fields
const fieldOf = k => fields().find(f => f.key === k)

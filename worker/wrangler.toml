name = "inventory-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = ""

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDO" }
]

# D1 データベース
# セットアップ手順:
#   1. npx wrangler d1 create inventory-store
#   2. 出力された database_id を下記に貼り付ける
#   3. npx wrangler d1 execute inventory-store --remote --file=./migrations/0001_init.sql
[[d1_databases]]
binding     = "DB"
database_name = "inventory-store"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

name = "inventory-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "d27afd2bc7f0a66b1275eb28d7b3d470"


[vars]
# 許可オリジン（カンマ区切りの完全一致）。空でもフェイルクローズ（既定の許可以外は 403）。
#
# **実際に配信されている host を必ずここへ書く**（WEB-02）。コード側 isAllowedOrigin が
# 常に許可するのは `*.inventory-app.pages.dev` と localhost だけで、
# 実際の Pages project の host は **`inventory-app-c40.pages.dev`**（`-c40` 付き）である。
# 名前が似ているため一致しない。
#
# 2026-08-28、旧Worker（任意Originを反射する状態）から現行Workerへ入れ替えた直後に
# フロントが全滅した（`Failed to fetch` = 403 で CORS ヘッダが付かない）。
# 旧Workerが緩かったせいで、host名の食い違いがそれまで表面化していなかった。
#   → 回帰testは cors.origins.test.js（この値を読んで実hostを確かめる）
#
# develop preview は仕様上この本番Workerを見る（docs/ci-cd.md）。外すと日々の実機確認が
# 止まるため許可へ含める。deployment hash の preview URL は含めない（都度変わるため）。
ALLOWED_ORIGIN = "https://inventory-app.pages.dev,https://inventory-app-c40.pages.dev,https://develop.inventory-app-c40.pages.dev"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDO" }
]

# D1 データベース
# セットアップ手順:
#   1. npx wrangler d1 create inventory-store
#   2. 出力された database_id を下記に貼り付ける
#   3. npx wrangler d1 execute inventory-store --remote --file=./migrations/0001_init.sql
[[d1_databases]]
binding     = "DB"
database_name = "inventory-store"
database_id = "0bcb5cd0-0c51-44f9-b7b7-65b0ce5862df"


[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Cronトリガー（毎日JST 10:00 = UTC 01:00）
# プッシュ通知の送信タイミング
[triggers]
crons = ["0 1 * * *"]

# Pro機能確認専用。productionとはWorker、D1、Durable Objectsを分離する。
# cronとVAPID secretsは継承しないため、review環境からPush通知は送らない。
[env.pro_review]
name = "inventory-sync-pro-review"

[env.pro_review.vars]
ALLOWED_ORIGIN = "https://pro-review.inventory-app-pro-review.pages.dev"
DEFAULT_STORE_PLAN = "pro"
# 検証環境だけ、サーバー側エラーの要約を応答へ載せる。
# スマホ（とくにPWA）は DevTools が使えず Worker のログも見られないため、
# 「503 でした」までしか分からず切り分けが止まる。**本番では設定しない**
# （DBのエラー文面はスキーマの手掛かりを含むため）。
DEBUG_ERRORS = "1"

[env.pro_review.durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDO" }
]

[[env.pro_review.d1_databases]]
binding = "DB"
database_name = "inventory-store-pro-review"
database_id = "e237eca8-89c8-44be-a3f2-323267e80539"

[[env.pro_review.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[env.pro_review.triggers]
crons = []

# VAPID キー（プッシュ通知用）— wrangler secret で設定:
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT
# キー生成: node -e "const wp=require('web-push'); console.log(wp.generateVAPIDKeys())"

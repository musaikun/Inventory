<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f6fafb" />
    <meta name="apple-mobile-web-app-title" content="タナオロ" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>タナオロ</title>
    <!-- URL を LINE などで共有したときのカード（OGP）。%PUBLIC_ORIGIN% は build 時に配信先へ置き換わる（vite.config.js） -->
    <meta name="description" content="みんなで、はやく、数える。飲食店の棚卸アプリ" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="タナオロ" />
    <meta property="og:title" content="タナオロ" />
    <meta property="og:description" content="みんなで、はやく、数える。飲食店の棚卸アプリ" />
    <meta property="og:image" content="%PUBLIC_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- JS が読み込まれるまでの間も起動画面と同じ地色にする（白く光らない）。Vue がマウントで置き換える -->
    <div id="app"><div style="position:fixed;inset:0;background:#061317"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

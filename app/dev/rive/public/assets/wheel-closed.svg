</g>
<g id="card-selected" opacity="1" transform="translate(16 0) scale(1 1)">
  <rect id="card-selected-surface" x="0.75" y="0.75" width="341.5" height="54.5" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect id="card-selected-count" x="209" y="6" width="48" height="44" rx="14" fill="#2563eb"/>
  <g id="change-control" opacity="1"><rect x="267" y="12" width="62" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/><path d="M 313 26 l 4 4 l 4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/></g>

</g>
<g id="selection-marker" opacity="0"><path d="M 0 -1 H 375 M 0 57 H 375" fill="none" stroke="#bfdbfe" stroke-width="1"/></g>
<g id="action-rail" opacity="0" transform="translate(0 -140)"><rect x="311" width="64" height="336" fill="#f8fafc"/><path d="M 311 0 V 336" fill="none" stroke="#eef2f6"/><g id="rail-add"><rect x="320" y="96" width="46" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/><path d="M 337 118 h 12 M 343 112 v 12" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/></g>

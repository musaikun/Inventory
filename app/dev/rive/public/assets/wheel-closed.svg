  <rect id="card-below-2-surface" x="0.75" y="0.75" width="341.5" height="54.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect id="card-below-2-count" x="281" y="12" width="48" height="32" rx="14" fill="#eef2f6"/>


</g>
<g id="card-above-1" opacity="0" transform="translate(16 0) scale(1 1)">
  <rect id="card-above-1-surface" x="0.75" y="0.75" width="341.5" height="54.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect id="card-above-1-count" x="281" y="12" width="48" height="32" rx="14" fill="#eef2f6"/>



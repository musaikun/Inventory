name: Test (PR / branches)

# develop 以外への push と PR で、取り込む「前」にテストを回す関門。
# develop-preview.yml は develop へ入った「後」の確認と preview 配信を担い、こちらは配信しない。
# Cloudflare の secret は使わない（E2E は Miniflare でローカル模擬。本番・preview の D1 に触れない）。
on:
  pull_request:
  push:
    branches-ignore:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / component (Worker + App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
      - name: Worker
        working-directory: worker
        run: |
          npm ci
          npm test
      - name: App
        working-directory: app
        run: |
          npm ci
          npm test
      - name: App build
        working-directory: app
        run: npm run build

  e2e:
    name: E2E (Playwright + local Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix worker
          npm ci --prefix app
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

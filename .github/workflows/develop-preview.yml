name: Develop Pages Preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: develop-pages-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: d27afd2bc7f0a66b1275eb28d7b3d470
  PAGES_PROJECT: inventory-app
  PAGES_BRANCH: develop

jobs:
  # E2E（Playwright + ローカルWorker=Miniflare）。ci.yml の e2e job と同じ中身。
  # 通らなければ preview を出さない（User指示 2026-11-24。developへ直接pushした変更もE2Eを通す）
  e2e:
    name: E2E (Playwright + local Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix worker
          npm ci --prefix app
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  test-build-deploy:
    name: Test, build, and deploy develop preview
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json

      # リンク切れ・主要ファイル一覧の実在・セッション記録のファイル名（ci.yml と同じ検査）
      - name: Docs check
        run: node scripts/check-docs-links.mjs

      - name: Install and test Worker
        working-directory: worker
        run: |
          npm ci
          npm test

      - name: Install and test App
        working-directory: app
        run: |
          npm ci
          npm test

      # VITE_SYNC_WORKER_URL は **build にだけ** 渡す。job全体のenvに置くとtestにも入り、
      # `utils/api.js` の HTTP_BASE が埋まって jsdom から本番Workerへ実際に fetch が飛ぶ
      # （api.js をmockしていないtestは、未設定なら即rejectする別の経路を通る）。
      # Pro Review 側は最初から build step だけに渡していたため、**同じcommitで
      # develop preview は通り Pro Review だけ落ちる**という非対称が生まれていた。
      # 手元も未設定なので、この形なら手元・develop・Pro Review の3つが揃う。
      - name: Build App
        working-directory: app
        env:
          VITE_SYNC_WORKER_URL: wss://inventory-sync.yuya-takaki.workers.dev
          VITE_PUBLIC_ORIGIN: https://develop.inventory-app-c40.pages.dev
        run: npm run build

      - name: Deploy develop preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write preview URL
        run: echo 'Preview URL = https://develop.inventory-app-c40.pages.dev' >> $GITHUB_STEP_SUMMARY

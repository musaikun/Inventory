name: Develop Pages Preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: develop-pages-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: d27afd2bc7f0a66b1275eb28d7b3d470
  PAGES_PROJECT: inventory-app
  PAGES_BRANCH: develop

jobs:
  test-build-deploy:
    name: Test, build, and deploy develop preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json

      - name: Install and test Worker
        working-directory: worker
        run: |
          npm ci
          npm test

      - name: Install and test App
        working-directory: app
        run: |
          npm ci
          npm test

      # VITE_SYNC_WORKER_URL は **build にだけ** 渡す。job全体のenvに置くとtestにも入り、
      # `utils/api.js` の HTTP_BASE が埋まって jsdom から本番Workerへ実際に fetch が飛ぶ
      # （api.js をmockしていないtestは、未設定なら即rejectする別の経路を通る）。
      # Pro Review 側は最初から build step だけに渡していたため、**同じcommitで
      # develop preview は通り Pro Review だけ落ちる**という非対称が生まれていた。
      # 手元も未設定なので、この形なら手元・develop・Pro Review の3つが揃う。
      - name: Build App
        working-directory: app
        env:
          VITE_SYNC_WORKER_URL: wss://inventory-sync.yuya-takaki.workers.dev
        run: npm run build

      - name: Deploy develop preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write preview URL
        run: echo 'Preview URL = https://develop.inventory-app-c40.pages.dev' >> $GITHUB_STEP_SUMMARY

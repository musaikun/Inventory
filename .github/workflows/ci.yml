name: CI

# develop 以外のすべての branch と PR で test・build・docs検査を回す。
# 並行セッションの branch が壊れていても、develop へ合流するまで分からなかったため（2026-11-07）。
# develop への push は develop-preview.yml が同じ検査をしてから preview を出すので、ここでは回さない。
# deploy はしない。secrets も使わない。

on:
  push:
    branches-ignore:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and test
        working-directory: worker
        run: |
          npm ci
          npm test

  app:
    name: App test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and test
        working-directory: app
        run: |
          npm ci
          npm test
      # build にだけ Worker の URL を渡す（test に入ると jsdom から本番へ fetch が飛ぶ。develop-preview.yml と同じ理由）
      - name: Build
        working-directory: app
        env:
          VITE_SYNC_WORKER_URL: wss://inventory-sync.yuya-takaki.workers.dev
        run: npm run build

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Links, key file list, session file names
        run: node scripts/check-docs-links.mjs

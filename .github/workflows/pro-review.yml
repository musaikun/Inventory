name: Pro Review Pages

on:
  # develop へ push されたら Pro Review も追随する。
  # Claude Code のセッションからは workflow_dispatch を叩けない（GitHub App に
  # actions: write が無く 403）ため、更新のたびに人が Actions を開く必要があった。
  # Pro Review は production から分離された検証環境（D-018）なので、develop と同じ内容へ
  # 自動で揃える。手動実行も残す。
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pro-review-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: d27afd2bc7f0a66b1275eb28d7b3d470
  PAGES_PROJECT: inventory-app-pro-review
  PAGES_BRANCH: pro-review

jobs:
  test-build-deploy:
    name: Test, build, and deploy protected Pro Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json

      - name: Install and test Worker
        working-directory: worker
        run: |
          npm ci
          npm test

      # テストは通常 build（Free）を前提にした期待値を持っている。VITE_REVIEW_PLAN=pro を
      # job 全体へ敷くと planLimits のテストが Pro 判定になって落ちるため、Pro の env は
      # build step にだけ渡す。
      - name: Install and test App
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Build Pro Review App
        working-directory: app
        env:
          VITE_SYNC_WORKER_URL: wss://inventory-sync-pro-review.yuya-takaki.workers.dev
          VITE_DEPLOYMENT_CHANNEL: pro-review
          VITE_REVIEW_PLAN: pro
        run: npm run build

      # Pro Review 専用 D1 の未適用マイグレーションだけを当てる（scripts/migrate.sh は
      # センチネル方式で冪等。既に入っているものは触らない）。
      #
      # **対象は Pro Review の D1 だけで、本番 D1 には一切触れない**（D-018 の分離）。
      # schema を変える変更を人手で当て忘れると、新しい Worker が存在しない table を
      # 参照して Pro Review だけ壊れる。検証環境なので、ここは自動で揃える。
      # 本番は WEB-04 の手順（preflight → User承認 → 順に適用）を維持する。
      - name: Apply pending D1 migrations (Pro Review only)
        env:
          DB_NAME: inventory-store-pro-review
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/migrate.sh

      # Pro Review は Pages だけでなく専用 Worker / D1 / DO も production と分離されている
      # （D-018）。Worker を置いていくと、config 中継の新フィールドがゲスト側から落ちるなど、
      # Pages だけ新しい状態で不整合が出る。必ず同じ run で両方を更新する。
      - name: Deploy Pro Review Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env pro_review

      - name: Deploy protected Pro Review preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Pro Review URL
        run: |
          echo 'Pro Review URL = https://pro-review.inventory-app-pro-review.pages.dev' >> $GITHUB_STEP_SUMMARY
          echo 'Worker = inventory-sync-pro-review（同じ run で更新済み）' >> $GITHUB_STEP_SUMMARY
          echo "App version = $(node -p "require('./app/package.json').version")" >> $GITHUB_STEP_SUMMARY
